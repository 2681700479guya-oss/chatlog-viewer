<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>Chat Viewer</title>

<style>
:root{
  --vh: 1vh;                 /* runtime */
  --header-h: 50px;          /* runtime */
  --footer-h: 62px;          /* runtime */
  --panel-h: 0px;            /* runtime */

  /* iOS-like palette */
  --bg-light:#f2f2f7;
  --bg-dark:#000000;
  --card-light:#ffffff;
  --card-dark:#1c1c1e;

  --sep-light: rgba(60,60,67,.18);
  --sep-dark:  rgba(84,84,88,.35);

  --text-light:#111111;
  --text-dark:#ffffff;
  --muted-light: rgba(60,60,67,.60);
  --muted-dark:  rgba(235,235,245,.60);

  --user:#0a84ff;
  --assistant-card-light:#ffffff;
  --assistant-card-dark:#1c1c1e;
  --system:#af52de;

  --chip-light: rgba(0,0,0,.06);
  --chip-dark:  rgba(255,255,255,.10);

  --bubble-max: 86%;
  --corner: 18px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg-light);
  color:var(--text-light);
  height: calc(var(--vh, 1vh) * 100);
  overflow:hidden;                 /* only content scrolls */
  overscroll-behavior:none;
}
body.dark{
  background:var(--bg-dark);
  color:var(--text-dark);
}

a{color:inherit}

/* ===== Top Nav ===== */
header{
  position:fixed; left:0; right:0; top:0;
  z-index:80;
  backdrop-filter:saturate(180%) blur(12px);
  background:color-mix(in oklab, #fff 88%, transparent);
  border-bottom:1px solid var(--sep-light);
  padding: .35rem .65rem;
  display:flex; align-items:center; justify-content:space-between;
  gap:.6rem;
}
body.dark header{
  background:color-mix(in oklab, #1c1c1e 88%, transparent);
  border-bottom-color:var(--sep-dark);
}
.h-left{display:flex; align-items:center; gap:.5rem; min-width:0}
.h-title{
  font-weight:650; font-size: .98rem;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition:opacity .2s, transform .2s;
}
.iconbtn{
  border:none; background:transparent; color:inherit;
  font-size:1.1rem; padding:.15rem .3rem; border-radius:10px;
}
.iconbtn:active{transform:scale(.98)}
.h-right{display:flex; gap:.4rem; align-items:center}
.pill{
  border:1px solid var(--sep-light);
  background:color-mix(in oklab, #fff 92%, transparent);
  color:inherit;
  border-radius:999px;
  padding:.34rem .55rem;
  font-size:.85rem;
  cursor:pointer;
}
body.dark .pill{
  border-color:var(--sep-dark);
  background:color-mix(in oklab, #2c2c2e 90%, transparent);
}

/* ===== Optional Top Panel (settings quick) ===== */
#panel{
  position:fixed; left:0; right:0;
  top:var(--header-h);
  z-index:75;
  display:none;
}
#panel.open{display:block}
.panel-inner{
  border-bottom:1px solid var(--sep-light);
  background:color-mix(in oklab, #fff 92%, transparent);
  backdrop-filter:saturate(180%) blur(10px);
  padding:.6rem .75rem;
}
body.dark .panel-inner{
  border-bottom-color:var(--sep-dark);
  background:color-mix(in oklab, #1c1c1e 92%, transparent);
}
.row{display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin:.15rem 0}
.badge{
  font-size:.75rem; font-weight:600;
  padding:.14rem .45rem; border-radius:999px;
  border:1px solid var(--sep-light);
  background:color-mix(in oklab, #fff 88%, transparent);
}
body.dark .badge{
  border-color:var(--sep-dark);
  background:color-mix(in oklab, #2c2c2e 88%, transparent);
}
input[type="text"], select, input[type="range"]{
  font-size:.85rem;
  padding:.34rem .55rem;
  border-radius:999px;
  border:1px solid var(--sep-light);
  background:color-mix(in oklab, #fff 92%, transparent);
  color:inherit;
}
body.dark input[type="text"], body.dark select, body.dark input[type="range"]{
  border-color:var(--sep-dark);
  background:color-mix(in oklab, #2c2c2e 90%, transparent);
}
input[type="file"]{display:none}
.colorbox{display:flex; gap:.45rem; align-items:center}
.colorbox label{font-size:.78rem; opacity:.85}
.colorbox input[type="color"]{width:30px;height:26px;border:none;background:transparent}

/* ===== Layout ===== */
#drawerBackdrop{
  position:fixed; inset:0;
  background:rgba(0,0,0,.25);
  opacity:0; pointer-events:none;
  transition:.2s;
  z-index:60;
}
#drawerBackdrop.show{opacity:1; pointer-events:auto}

#drawer{
  position:fixed;
  left:0;
  top:var(--header-h);
  bottom:var(--footer-h);
  width:290px;
  background:var(--card-light);
  border-right:1px solid var(--sep-light);
  box-shadow:8px 0 24px rgba(0,0,0,.12);
  transform:translateX(-100%);
  transition:transform .25s ease;
  z-index:70;
  display:flex; flex-direction:column;
}
body.dark #drawer{
  background:var(--card-dark);
  border-right-color:var(--sep-dark);
  box-shadow:8px 0 24px rgba(0,0,0,.45);
}
#drawer.open{transform:translateX(0)}
.drawer-head{
  padding:.7rem .8rem;
  border-bottom:1px solid var(--sep-light);
  display:flex; align-items:center; justify-content:space-between; gap:.6rem;
}
body.dark .drawer-head{border-bottom-color:var(--sep-dark)}
.drawer-title{font-weight:700}
.drawer-tabs{display:flex; gap:.35rem}
.dtab{
  padding:.22rem .55rem;
  border-radius:999px;
  border:1px solid var(--sep-light);
  background:transparent;
  font-size:.78rem;
  cursor:pointer;
}
body.dark .dtab{border-color:var(--sep-dark)}
.dtab.active{
  background:color-mix(in oklab, var(--user) 12%, transparent);
  border-color:color-mix(in oklab, var(--user) 32%, transparent);
}
.drawer-list{
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  padding:.45rem;
  flex:1;
}
.item{
  padding:.55rem .65rem;
  border-radius:12px;
  border:1px solid transparent;
  cursor:pointer;
}
.item:hover{background:color-mix(in oklab,currentColor 6%,transparent)}
.item.active{
  background:color-mix(in oklab, var(--user) 10%, transparent);
  border-color:color-mix(in oklab, var(--user) 30%, transparent);
}
.item .sub{
  margin-top:.16rem;
  font-size:.74rem;
  color:var(--muted-light);
}
body.dark .item .sub{color:var(--muted-dark)}

/* ===== Content (only scroll area) ===== */
main{
  position:fixed;
  left:0; right:0;
  top:calc(var(--header-h) + var(--panel-h));
  bottom:var(--footer-h);
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:.75rem .65rem 1rem .65rem;
}
.container{
  max-width:980px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:.62rem;
  overflow-anchor:none;
}

.section-title{
  font-weight:800;
  margin:.25rem 0 .4rem 0;
  font-size:1.02rem;
}

.muted{color:var(--muted-light)}
body.dark .muted{color:var(--muted-dark)}

/* ===== Chat bubbles ===== */
.meta, .name{
  font-size:.72rem;
  color:var(--muted-light);
}
body.dark .meta, body.dark .name{color:var(--muted-dark)}
.meta{display:flex; gap:.45rem; flex-wrap:wrap; margin:.05rem .18rem}
.name{margin:0 .18rem .18rem .18rem}

.align-right{margin-left:auto;text-align:right}
.align-left{margin-right:auto;text-align:left}
.align-center{margin-left:auto;margin-right:auto;text-align:center}

.chip{
  padding:.08rem .4rem;
  border-radius:999px;
  background:var(--chip-light);
  border:1px solid var(--sep-light);
}
body.dark .chip{
  background:var(--chip-dark);
  border-color:var(--sep-dark);
}

.msg{
  max-width:var(--bubble-max);
  border-radius:var(--corner);
  padding:.55rem .72rem;
  line-height:1.55;
  white-space:pre-wrap;
  box-shadow:0 1px 0 rgba(0,0,0,.03);
}
.msg.user{
  background:var(--user);
  color:#fff;
  margin-left:auto;
  box-shadow:0 1px 0 rgba(10,132,255,.25);
}
.msg.assistant{
  background:var(--assistant-card-light);
  color:#111;
  margin-right:auto;
  box-shadow:0 1px 0 rgba(0,0,0,.04);
}
body.dark .msg.assistant{
  background:var(--assistant-card-dark);
  color:#fff;
  box-shadow:0 1px 0 rgba(0,0,0,.28);
}
.msg.system{
  background:color-mix(in oklab, var(--system) 20%, transparent);
  border:1px solid color-mix(in oklab, var(--system) 26%, transparent);
  color:color-mix(in oklab, #111 60%, var(--system) 40%);
  margin-left:auto; margin-right:auto;
  box-shadow:none;
}
body.dark .msg.system{
  color:color-mix(in oklab, #fff 70%, var(--system) 30%);
}

/* ===== Branch pager (回溯翻页) ===== */
.branch-wrap{
  max-width:var(--bubble-max);
  margin:.15rem 0 .35rem 0;
}
.branch-wrap.right{margin-left:auto}
.branch-wrap.left{margin-right:auto}
.branch-bar{
  display:flex; align-items:center; justify-content:space-between;
  gap:.45rem;
  padding:.35rem .5rem;
  border-radius:14px;
  border:1px dashed color-mix(in oklab, var(--user) 42%, transparent);
  background:color-mix(in oklab, var(--user) 8%, transparent);
  user-select:none;
}
.branch-bar .mini{
  font-size:.78rem; font-weight:700;
}
.branch-bar .hint{
  font-size:.74rem; color:var(--muted-light);
}
body.dark .branch-bar .hint{color:var(--muted-dark)}
.bbtn{
  border:1px solid var(--sep-light);
  background:color-mix(in oklab, #fff 92%, transparent);
  border-radius:999px;
  padding:.18rem .55rem;
  font-size:.85rem;
  cursor:pointer;
}
body.dark .bbtn{
  border-color:var(--sep-dark);
  background:color-mix(in oklab, #2c2c2e 92%, transparent);
}
.branch-view{
  margin-top:.35rem;
  padding:.45rem .55rem;
  border-radius:14px;
  background:color-mix(in oklab, #fff 78%, transparent);
  border:1px solid var(--sep-light);
}
body.dark .branch-view{
  background:color-mix(in oklab, #1c1c1e 78%, transparent);
  border-color:var(--sep-dark);
}
.branch-view .meta{margin:.08rem .08rem}
.branch-view .msg{max-width:100%}
.branch-view .msg.user{margin-left:auto}
.branch-view .msg.assistant{margin-right:auto}

/* ===== Memories list ===== */
.mem-search{
  display:flex; gap:.5rem; align-items:center; flex-wrap:wrap;
  margin:.25rem 0 .35rem 0;
}
.mem-card{
  background:var(--card-light);
  border:1px solid var(--sep-light);
  border-radius:14px;
  padding:.65rem .7rem;
}
body.dark .mem-card{
  background:var(--card-dark);
  border-color:var(--sep-dark);
}
.mem-line{white-space:pre-wrap; line-height:1.5}

/* ===== Bottom Tab Bar ===== */
footer{
  position:fixed; left:0; right:0; bottom:0;
  height:var(--footer-h);
  z-index:85;
  backdrop-filter:saturate(180%) blur(12px);
  background:color-mix(in oklab, #fff 88%, transparent);
  border-top:1px solid var(--sep-light);
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:.25rem .35rem;
}
body.dark footer{
  background:color-mix(in oklab, #1c1c1e 88%, transparent);
  border-top-color:var(--sep-dark);
}
.tab{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:.1rem;
  font-size:.72rem;
  color:var(--muted-light);
  min-width:70px;
  padding:.2rem .2rem;
  border-radius:12px;
  cursor:pointer;
}
body.dark .tab{color:var(--muted-dark)}
.tab .ticon{font-size:1.15rem; line-height:1}
.tab.active{
  color:color-mix(in oklab, var(--user) 65%, #111 35%);
  background:color-mix(in oklab, var(--user) 10%, transparent);
}
body.dark .tab.active{
  color:color-mix(in oklab, var(--user) 70%, #fff 30%);
}

/* ===== Toast/Error ===== */
#toast{
  position:fixed; left:0; right:0; bottom:calc(var(--footer-h) + 8px);
  z-index:95;
  display:none;
  justify-content:center;
  pointer-events:none;
}
#toast.show{display:flex}
.toast-inner{
  max-width:92vw;
  background:rgba(192,57,43,.95);
  color:#fff;
  padding:.5rem .75rem;
  border-radius:12px;
  font-size:.86rem;
  pointer-events:none;
}

/* Desktop-ish width: keep nice */
@media (min-width:1100px){
  #drawer{transform:translateX(0)}
  #drawerBackdrop{display:none}
  main{left:290px}
  header{left:290px}
  footer{left:290px}
}
</style>
</head>

<body>
<header id="header">
  <div class="h-left">
    <button class="iconbtn" id="btnDrawer" aria-label="菜单">☰</button>
    <div class="h-title" id="navTitle">Chat Viewer</div>
  </div>
  <div class="h-right">
    <input id="file" type="file" accept=".json" multiple />
    <button class="pill" id="btnImport">导入</button>
    <button class="pill" id="btnExport">导出当前</button>
    <button class="pill" id="btnPanel">设置</button>
    <button class="pill" id="btnTheme">夜间</button>
  </div>
</header>

<!-- Top Panel -->
<div id="panel">
  <div class="panel-inner">
    <div class="row">
      <span class="badge">会话</span>
      <select id="selConv"></select>
      <span class="badge" id="convMeta">未导入</span>
    </div>

    <div class="row">
      <span class="badge">气泡宽度</span>
      <input type="range" id="rngBubble" min="60" max="100" value="86" />
      <span class="badge" id="txtBubble">86%</span>
    </div>

    <div class="row">
      <span class="badge">颜色</span>
      <div class="colorbox">
        <label>用户</label><input type="color" id="cUser" />
        <label>系统</label><input type="color" id="cSys" />
      </div>
      <button class="pill" id="btnReset">恢复默认</button>
    </div>

    <div class="row">
      <span class="badge">显示名</span>
      <input type="text" id="nmUser" placeholder="用户显示名" style="width:8.5rem">
      <input type="text" id="nmAsst" placeholder="助手显示名" style="width:8.5rem">
      <input type="text" id="nmSys" placeholder="系统显示名" style="width:8.5rem">
      <button class="pill" id="btnSaveNames">保存</button>
    </div>
  </div>
</div>

<div id="drawerBackdrop"></div>
<aside id="drawer">
  <div class="drawer-head">
    <div class="drawer-title">列表</div>
    <div class="drawer-tabs">
      <button class="dtab active" id="dtChats">聊天</button>
      <button class="dtab" id="dtMems">记忆</button>
    </div>
    <button class="pill" id="btnCloseDrawer">关闭</button>
  </div>
  <div class="drawer-list" id="drawerList"></div>
</aside>

<main id="main">
  <div class="container" id="view">
    <div class="section-title">聊天</div>
    <div class="muted">点右上角「导入」，选择 ChatGPT 官方导出的 <b>conversations.json</b>；如要看「我的记忆」，再同时选择 <b>memories.json</b>。</div>
    <div class="muted">提示：可以一次选多个文件导入（iPhone 文件选择器支持多选）。</div>
  </div>
</main>

<footer>
  <div class="tab active" id="tabChats"><div class="ticon">💬</div><div>聊天</div></div>
  <div class="tab" id="tabMems"><div class="ticon">🧠</div><div>记忆</div></div>
  <div class="tab" id="tabSettings"><div class="ticon">⚙️</div><div>设置</div></div>
</footer>

<div id="toast"><div class="toast-inner" id="toastText"></div></div>

<script>
/* ========= Toast ========= */
const toast = (msg)=>{
  const t=document.getElementById('toast');
  document.getElementById('toastText').textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 5200);
};

/* ========= Stable VH (anti-jitter) ========= */
function setStableVH(){
  const vh = window.innerHeight * 0.01;
  document.documentElement.style.setProperty('--vh', `${vh}px`);
}
function measureBars(){
  const headerH = document.getElementById('header').offsetHeight || 50;
  document.documentElement.style.setProperty('--header-h', headerH+'px');

  const footerH = document.querySelector('footer').offsetHeight || 62;
  document.documentElement.style.setProperty('--footer-h', footerH+'px');

  const panel = document.getElementById('panel');
  const ph = panel.classList.contains('open') ? (panel.offsetHeight || 0) : 0;
  document.documentElement.style.setProperty('--panel-h', ph+'px');
}
function layoutTick(){
  setStableVH();
  measureBars();
}
window.addEventListener('resize', layoutTick);
window.addEventListener('orientationchange', ()=>setTimeout(layoutTick, 250));

/* ========= Preferences ========= */
const PREF_KEY = 'chatviewer_ios_full_v1';
const prefs = (()=>{ try{return JSON.parse(localStorage.getItem(PREF_KEY))||{};}catch{return{};} })();
const savePrefs = ()=>{ try{localStorage.setItem(PREF_KEY, JSON.stringify(prefs));}catch{} };

function setCSS(k,v){document.documentElement.style.setProperty(k,v);}

/* ========= State ========= */
let conversations = [];       // parsed conversations
let currentConv = 0;
let memories = [];            // parsed memories
let viewMode = 'chats';       // chats | mems | settings
let drawerMode = 'chats';     // drawer list content

/* ========= DOM ========= */
const btnDrawer = document.getElementById('btnDrawer');
const btnCloseDrawer = document.getElementById('btnCloseDrawer');
const drawer = document.getElementById('drawer');
const drawerBackdrop = document.getElementById('drawerBackdrop');
const drawerList = document.getElementById('drawerList');
const dtChats = document.getElementById('dtChats');
const dtMems = document.getElementById('dtMems');

const fileInput = document.getElementById('file');
document.getElementById('btnImport').onclick = ()=> fileInput.click();
document.getElementById('btnExport').onclick = ()=> exportCurrent();
document.getElementById('btnPanel').onclick = ()=> togglePanel();
document.getElementById('btnTheme').onclick = ()=> toggleTheme();

const panel = document.getElementById('panel');
const selConv = document.getElementById('selConv');
const convMeta = document.getElementById('convMeta');

const rngBubble = document.getElementById('rngBubble');
const txtBubble = document.getElementById('txtBubble');

const cUser = document.getElementById('cUser');
const cSys = document.getElementById('cSys');

const nmUser = document.getElementById('nmUser');
const nmAsst = document.getElementById('nmAsst');
const nmSys  = document.getElementById('nmSys');

document.getElementById('btnReset').onclick = ()=> resetTheme();
document.getElementById('btnSaveNames').onclick = ()=> saveNames();

const tabChats = document.getElementById('tabChats');
const tabMems = document.getElementById('tabMems');
const tabSettings = document.getElementById('tabSettings');

const main = document.getElementById('main');
const navTitle = document.getElementById('navTitle');
const view = document.getElementById('view');

/* ========= Drawer ========= */
function openDrawer(on){
  if(window.matchMedia('(min-width:1100px)').matches) return; // desktop: always open
  drawer.classList.toggle('open', on);
  drawerBackdrop.classList.toggle('show', on);
}
btnDrawer.onclick = ()=> openDrawer(true);
btnCloseDrawer.onclick = ()=> openDrawer(false);
drawerBackdrop.onclick = ()=> openDrawer(false);

dtChats.onclick = ()=>{
  drawerMode='chats';
  dtChats.classList.add('active'); dtMems.classList.remove('active');
  buildDrawerList();
};
dtMems.onclick = ()=>{
  drawerMode='mems';
  dtMems.classList.add('active'); dtChats.classList.remove('active');
  buildDrawerList();
};

function buildDrawerList(){
  drawerList.innerHTML = '';
  if(drawerMode==='chats'){
    if(!conversations.length){
      drawerList.innerHTML = `<div class="muted" style="padding:.6rem .65rem">还没有导入会话。</div>`;
      return;
    }
    conversations.forEach((c,idx)=>{
      const item=document.createElement('div');
      item.className='item' + (idx===currentConv?' active':'');
      const dateStr = c.created ? new Date(c.created*1000).toLocaleDateString() : '';
      item.innerHTML = `<div>${escapeHTML(c.title || `(无标题) ${idx+1}`)}</div>
                        <div class="sub">消息 ${c.messages.length}${dateStr?` · ${dateStr}`:''} · 字数 ${c.totalChars||0}</div>`;
      item.onclick=()=>{
        currentConv = idx;
        selConv.value = String(idx);
        updateConvMeta();
        renderChats();
        buildDrawerList();
        openDrawer(false);
        main.scrollTop = 0;
      };
      drawerList.appendChild(item);
    });
  }else{
    // memories list
    const head=document.createElement('div');
    head.className='muted';
    head.style.padding='.6rem .65rem .25rem .65rem';
    head.innerHTML = memories.length ? `已导入记忆：<b>${memories.length}</b> 条` : `还没有导入 memories.json`;
    drawerList.appendChild(head);

    if(memories.length){
      memories.slice(0,50).forEach((m,idx)=>{
        const it=document.createElement('div');
        it.className='item';
        it.innerHTML = `<div>记忆 #${idx+1}</div><div class="sub">${escapeHTML((m.text||'').slice(0,60))}${(m.text||'').length>60?'…':''}</div>`;
        it.onclick=()=>{
          setMode('mems');
          openDrawer(false);
          // scroll to this memory card
          setTimeout(()=>{
            const el=document.querySelector(`[data-mem-idx="${idx}"]`);
            if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
          },80);
        };
        drawerList.appendChild(it);
      });
    }
  }
}

/* ========= Tabs ========= */
function setActiveTab(which){
  [tabChats,tabMems,tabSettings].forEach(t=>t.classList.remove('active'));
  if(which==='chats') tabChats.classList.add('active');
  if(which==='mems') tabMems.classList.add('active');
  if(which==='settings') tabSettings.classList.add('active');
}
function setMode(mode){
  viewMode = mode;
  setActiveTab(mode);
  if(mode==='chats'){ navTitle.textContent = conversations[currentConv]?.title || '聊天'; renderChats(); }
  if(mode==='mems'){ navTitle.textContent = '我的记忆'; renderMems(); }
  if(mode==='settings'){ navTitle.textContent = '设置'; renderSettings(); }
}

/* ========= Import ========= */
fileInput.addEventListener('change', async(e)=>{
  const files = [...(e.target.files||[])];
  if(!files.length) return;

  try{
    const payloads = [];
    for(const f of files){
      const text = await f.text();
      let json;
      try{ json = JSON.parse(text); }catch{ continue; }
      payloads.push({name:(f.name||'').toLowerCase(), json});
    }
    if(!payloads.length){
      toast('未识别到有效 JSON');
      return;
    }
    // classify by filename first, fallback by structure
    for(const p of payloads){
      if(p.name.includes('memories')){
        memories = parseMemories(p.json);
      }else if(p.name.includes('conversation') || p.name.includes('conversations')){
        conversations = parseConversations(p.json);
      }else{
        // heuristic
        const maybe = tryParseAsConversationPack(p.json);
        if(maybe?.type==='conversations') conversations = maybe.data;
        const maybeMem = tryParseAsMemories(p.json);
        if(maybeMem?.type==='memories') memories = maybeMem.data;
      }
    }

    // post process
    if(conversations.length){
      conversations.forEach(c=>{
        c.totalChars = c.messages.reduce((acc,m)=>acc+(m.content?m.content.length:0),0);
      });
      buildConvSelect();
      currentConv = Math.min(currentConv, conversations.length-1);
      selConv.value = String(currentConv);
      updateConvMeta();
    }

    buildDrawerList();

    // default view
    setMode('chats');
    toast(`导入完成：会话 ${conversations.length} 个${memories.length?`｜记忆 ${memories.length} 条`:''}`);

    main.scrollTop=0;
  }catch(err){
    toast('导入失败：' + (err?.message||String(err)));
  }finally{
    fileInput.value='';
    layoutTick();
  }
});

/* ========= Conversations parsing ========= */
function tryParseAsConversationPack(json){
  try{
    const data = parseConversations(json);
    if(data.length) return {type:'conversations', data};
  }catch{}
  return null;
}
function parseConversations(data){
  const out = [];
  if(Array.isArray(data)){
    data.forEach(obj=>{ const c=parseConversation(obj); if(c) out.push(c); });
  }else if(data && typeof data==='object'){
    if(Array.isArray(data.items)){
      data.items.forEach(obj=>{ const c=parseConversation(obj); if(c) out.push(c); });
    }else{
      const c=parseConversation(data); if(c) out.push(c);
    }
  }
  return out;
}

function parseConversation(obj){
  const title = obj.title || obj.gist || obj.name || '';
  const created = obj.create_time || obj.update_time || obj.created || 0;

  // mapping export (official)
  const mapping = obj.mapping;
  const current = obj.current_node;

  if(mapping && current){
    // build main path
    const pathIds=[];
    let nodeId=current;
    while(nodeId && mapping[nodeId]){
      pathIds.push(nodeId);
      nodeId = mapping[nodeId].parent || null;
    }
    pathIds.reverse();
    const pathSet=new Set(pathIds);

    const messages=[];
    pathIds.forEach(pid=>{
      const node=mapping[pid];
      const m=normalizeNodeMessage(node);
      if(m) messages.push(m);
    });

    // map nodeId -> index
    const idToIndex=new Map();
    messages.forEach((m,i)=>idToIndex.set(m._nodeId,i));

    // collect branch threads: each sibling child not on path becomes a separate thread (linear-ish)
    pathIds.forEach(pid=>{
      const node=mapping[pid];
      const children=Array.isArray(node.children)?node.children:[];
      const branchKids=children.filter(cid=>!pathSet.has(cid));
      if(!branchKids.length) return;

      const threads=[];
      for(const kid of branchKids){
        const thread = collectBranchThread(mapping, kid, 120);
        if(thread.length) threads.push(thread);
      }
      const at=idToIndex.get(pid);
      if(typeof at==='number' && threads.length){
        messages[at].branches = threads;
      }
    });

    const cleaned = messages.filter(m=>m.content && m.content.trim().length);
    return {id:obj.id||crypto.randomUUID(), title, created, messages:cleaned, totalChars:0};
  }

  // fallback: linear messages array
  if(Array.isArray(obj.messages)){
    const msgs=obj.messages.map(normalizeLinearMessage).filter(Boolean);
    return {id:obj.id||crypto.randomUUID(), title, created, messages:msgs, totalChars:0};
  }
  return null;
}

function normalizeLinearMessage(m){
  const role=m.role||(m.author?.role)||"assistant";
  const parts=Array.isArray(m.content?.parts)?m.content.parts.join("\n"):(m.content?.text||m.content||"");
  const content=typeof parts==='string'?parts:JSON.stringify(parts);
  const model=m.model||m.metadata?.model_slug||m.metadata?.model||"";
  const ts=m.create_time||m.ts||0;
  return {role,content,model,ts,branches:[]};
}

function normalizeNodeMessage(node){
  const msg=node.message;
  if(!msg || !msg.author) return null;
  const role=msg.author.role||"assistant";
  if(!["user","assistant","system"].includes(role)) return null;

  let text="";
  if(Array.isArray(msg.content?.parts)) text=msg.content.parts.join("\n");
  else if(typeof msg.content?.text==='string') text=msg.content.text;
  else if(typeof msg.content==='string') text=msg.content;

  const model=msg.metadata?.model_slug||msg.metadata?.model||msg.model_slug||msg.model||"";
  const ts=msg.create_time||node.create_time||0;

  return {role,content:text||"",model,ts,branches:[],_nodeId:node.id};
}

// A "thread" = linear walk from startId following the most likely continuation.
// If a node has multiple children, we stop (because it becomes another branch).
function collectBranchThread(mapping, startId, limit=120){
  const thread=[];
  let id=startId;
  let safety=0;
  while(id && mapping[id] && safety<limit){
    safety++;
    const node=mapping[id];
    const m=normalizeNodeMessage(node);
    if(m && m.content && m.content.trim().length){
      thread.push({role:m.role, content:m.content, ts:m.ts, model:m.model});
    }
    const kids = Array.isArray(node.children)?node.children:[];
    if(kids.length!==1) break;
    id = kids[0];
  }
  return thread;
}

/* ========= Memories parsing =========
   ChatGPT export "memories.json" formats may vary; we support common shapes:
   - Array of {id, memory, text, ...}
   - Object with items: [...]
*/
function tryParseAsMemories(json){
  try{
    const data = parseMemories(json);
    if(data.length) return {type:'memories', data};
  }catch{}
  return null;
}
function parseMemories(data){
  let arr=[];
  if(Array.isArray(data)) arr=data;
  else if(data && typeof data==='object'){
    if(Array.isArray(data.items)) arr=data.items;
    else if(Array.isArray(data.memories)) arr=data.memories;
    else if(Array.isArray(data.data)) arr=data.data;
  }

  const out=[];
  for(const it of arr){
    if(typeof it === 'string'){
      out.push({text:it, created:0, source:'string'});
      continue;
    }
    if(!it || typeof it!=='object') continue;

    const text =
      it.memory || it.text || it.content || it.value || it.title || it.summary || '';

    if(!text) continue;

    out.push({
      id: it.id || it.memory_id || it.key || crypto.randomUUID(),
      text: String(text),
      created: it.created_at || it.create_time || it.timestamp || 0,
      raw: it
    });
  }
  return out;
}

/* ========= UI building ========= */
function escapeHTML(s){
  return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function buildConvSelect(){
  selConv.innerHTML='';
  conversations.forEach((c,idx)=>{
    const opt=document.createElement('option');
    opt.value=String(idx);
    opt.textContent = c.title || `(无标题) ${idx+1}`;
    selConv.appendChild(opt);
  });
  selConv.onchange = ()=>{
    currentConv = Number(selConv.value)||0;
    updateConvMeta();
    renderChats();
    buildDrawerList();
    main.scrollTop=0;
  };
}

function updateConvMeta(){
  if(!conversations.length){
    convMeta.textContent='未导入';
    return;
  }
  const c=conversations[currentConv];
  const created = c.created ? new Date(c.created*1000).toLocaleString() : '—';
  const total = c.messages.reduce((acc,m)=>acc+(m.content?m.content.length:0),0);
  c.totalChars = total;
  convMeta.textContent = `创建：${created}｜消息：${c.messages.length}｜字数：${total}`;
}

/* ========= Render: Chats ========= */
function roleClass(role){
  if(role==='user') return 'user';
  if(role==='system') return 'system';
  return 'assistant';
}

function renderChats(){
  view.innerHTML='';
  const title = document.createElement('div');
  title.className='section-title';
  title.textContent='聊天';
  view.appendChild(title);

  if(!conversations.length){
    view.innerHTML += `<div class="muted">还没有导入会话。点右上角「导入」选择 conversations.json。</div>`;
    return;
  }

  const c = conversations[currentConv];
  navTitle.textContent = c.title || '聊天';

  c.messages.forEach((m, msgIndex)=>{
    const name=displayName(m.role);
    if(name){
      const nm=document.createElement('div');
      nm.className='name ' + (m.role==='user'?'align-right':m.role==='assistant'?'align-left':'align-center');
      nm.textContent=name;
      view.appendChild(nm);
    }

    const meta=document.createElement('div');
    meta.className='meta ' + (m.role==='user'?'align-right':m.role==='assistant'?'align-left':'align-center');
    const ts = m.ts ? new Date(m.ts*1000).toLocaleString() : '';
    const model = m.model || '';
    const count = (m.content||'').length;
    meta.innerHTML = `${ts?`<span>${escapeHTML(ts)}</span>`:''}
                      ${model?`<span class="chip">${escapeHTML(model)}</span>`:''}
                      <span>字数：${count}</span>`;
    view.appendChild(meta);

    const bubble=document.createElement('div');
    bubble.className='msg ' + roleClass(m.role);
    bubble.innerText = m.content || '';
    view.appendChild(bubble);

    // Branch pager: show only if branches exist
    if(Array.isArray(m.branches) && m.branches.length){
      const wrap=document.createElement('div');
      wrap.className='branch-wrap ' + (m.role==='user'?'right':'left');

      const bar=document.createElement('div');
      bar.className='branch-bar';

      const leftBtn=document.createElement('button');
      leftBtn.className='bbtn';
      leftBtn.textContent='‹';

      const mid=document.createElement('div');
      mid.style.display='flex';
      mid.style.flexDirection='column';
      mid.style.gap='.1rem';

      const mini=document.createElement('div');
      mini.className='mini';
      // default: show "＜1/N＞" but do NOT open content yet
      mini.textContent = `＜1/${m.branches.length}＞`;
      const hint=document.createElement('div');
      hint.className='hint';
      hint.textContent='回溯分支（点“展开”查看）';
      mid.appendChild(mini);
      mid.appendChild(hint);

      const rightBtn=document.createElement('button');
      rightBtn.className='bbtn';
      rightBtn.textContent='›';

      const toggleBtn=document.createElement('button');
      toggleBtn.className='bbtn';
      toggleBtn.textContent='展开';

      bar.appendChild(leftBtn);
      bar.appendChild(mid);
      bar.appendChild(rightBtn);
      bar.appendChild(toggleBtn);

      const viewBox=document.createElement('div');
      viewBox.className='branch-view';
      viewBox.style.display='none';

      let page=0;

      function renderBranchPage(){
        mini.textContent = `＜${page+1}/${m.branches.length}＞`;
        viewBox.innerHTML='';
        const thread = m.branches[page] || [];
        if(!thread.length){
          viewBox.innerHTML = `<div class="muted">（该分支暂无可显示内容）</div>`;
          return;
        }
        // Render thread messages (compact)
        thread.forEach(b=>{
          const meta2=document.createElement('div');
          meta2.className='meta ' + (b.role==='user'?'align-right':b.role==='assistant'?'align-left':'align-center');
          const ts2 = b.ts ? new Date(b.ts*1000).toLocaleString() : '';
          const model2 = b.model || '';
          meta2.innerHTML = `${ts2?`<span>${escapeHTML(ts2)}</span>`:''}
                            ${model2?`<span class="chip">${escapeHTML(model2)}</span>`:''}
                            <span>字数：${(b.content||'').length}</span>`;
          viewBox.appendChild(meta2);

          const bb=document.createElement('div');
          bb.className='msg ' + roleClass(b.role);
          bb.innerText = b.content || '';
          viewBox.appendChild(bb);
        });
      }

      leftBtn.onclick=()=>{
        page = (page - 1 + m.branches.length) % m.branches.length;
        renderBranchPage();
      };
      rightBtn.onclick=()=>{
        page = (page + 1) % m.branches.length;
        renderBranchPage();
      };
      toggleBtn.onclick=()=>{
        const open = viewBox.style.display !== 'none';
        if(open){
          viewBox.style.display='none';
          toggleBtn.textContent='展开';
          hint.textContent='回溯分支（点“展开”查看）';
        }else{
          renderBranchPage();
          viewBox.style.display='block';
          toggleBtn.textContent='收起';
          hint.textContent='左右翻页切换分支';
        }
      };

      wrap.appendChild(bar);
      wrap.appendChild(viewBox);
      view.appendChild(wrap);
    }
  });

  updateConvMeta();
}

/* ========= Render: Memories ========= */
function renderMems(){
  view.innerHTML='';
  const title=document.createElement('div');
  title.className='section-title';
  title.textContent='我的记忆';
  view.appendChild(title);

  const info=document.createElement('div');
  info.className='muted';
  info.innerHTML = memories.length
    ? `已导入 <b>${memories.length}</b> 条记忆。`
    : `还没有导入 <b>memories.json</b>。你可以在「导入」时多选 conversations.json + memories.json 一起导入。`;
  view.appendChild(info);

  const searchWrap=document.createElement('div');
  searchWrap.className='mem-search';
  searchWrap.innerHTML = `
    <span class="badge">搜索</span>
    <input type="text" id="memQ" placeholder="输入关键字…" style="width:14rem">
    <button class="pill" id="memClear">清空</button>
  `;
  view.appendChild(searchWrap);

  const qInput = searchWrap.querySelector('#memQ');
  const clearBtn = searchWrap.querySelector('#memClear');

  const list=document.createElement('div');
  list.style.display='flex';
  list.style.flexDirection='column';
  list.style.gap='.55rem';
  view.appendChild(list);

  function draw(query=''){
    list.innerHTML='';
    const q = query.trim().toLowerCase();
    const arr = q ? memories.filter(m=>(m.text||'').toLowerCase().includes(q)) : memories;

    if(!memories.length){
      list.innerHTML = `<div class="muted">（暂无记忆数据）</div>`;
      return;
    }
    if(q && !arr.length){
      list.innerHTML = `<div class="muted">没有匹配结果。</div>`;
      return;
    }

    arr.forEach((m,idx)=>{
      const card=document.createElement('div');
      card.className='mem-card';
      card.dataset.memIdx = String(idx);

      const top=document.createElement('div');
      top.className='meta';
      const ts = (m.created && typeof m.created==='number' && m.created>1000000000)
        ? new Date(m.created*1000).toLocaleString()
        : '';
      top.innerHTML = `<span class="chip">记忆</span>${ts?`<span>${escapeHTML(ts)}</span>`:''}
                      <span>字数：${(m.text||'').length}</span>
                      <button class="pill" style="padding:.22rem .55rem" data-copy="1">复制</button>`;
      card.appendChild(top);

      const line=document.createElement('div');
      line.className='mem-line';
      line.textContent = m.text || '';
      card.appendChild(line);

      card.querySelector('[data-copy]').onclick = async()=>{
        try{
          await navigator.clipboard.writeText(m.text||'');
          toast('已复制');
        }catch{
          toast('复制失败（可能被浏览器限制）');
        }
      };

      list.appendChild(card);
    });
  }

  qInput.oninput = ()=> draw(qInput.value);
  clearBtn.onclick = ()=>{ qInput.value=''; draw(''); };

  // restore last query optional
  draw('');
}

/* ========= Export ========= */
function exportCurrent(){
  if(!conversations.length){
    toast('没有可导出的会话');
    return;
  }
  const c = conversations[currentConv];

  const rootStyle = getComputedStyle(document.documentElement);
  const cssVars = [
    '--user','--system','--bubble-max','--bg-light','--text-light','--sep-light','--chip-light'
  ].map(v=>`${v}:${rootStyle.getPropertyValue(v).trim()}`).join(';');

  const esc = s => (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

  const nameOf = (role)=>{
    const n=prefs.names||{};
    if(role==='user') return n.user||'';
    if(role==='assistant') return n.assistant||'';
    if(role==='system') return n.system||'';
    return '';
  };

  const metaLine = (role, ts, model, text)=>{
    const side = role==='user'?'align-right':role==='assistant'?'align-left':'align-center';
    return `<div class="meta ${side}">
      ${ts?`<span>${esc(ts)}</span>`:''}
      ${model?`<span class="chip">${esc(model)}</span>`:''}
      <span>字数：${(text||'').length}</span>
    </div>`;
  };

  const bubble = (role, text)=>{
    const cls = role==='user'?'user':role==='system'?'system':'assistant';
    return `<div class="msg ${cls}">${esc(text||'')}</div>`;
  };

  let body = '';
  c.messages.forEach(m=>{
    const nm = nameOf(m.role);
    if(nm){
      const side = m.role==='user'?'align-right':m.role==='assistant'?'align-left':'align-center';
      body += `<div class="name ${side}">${esc(nm)}</div>`;
    }
    const ts = m.ts ? new Date(m.ts*1000).toLocaleString() : '';
    body += metaLine(m.role, ts, m.model||'', m.content||'');
    body += bubble(m.role, m.content||'');

    // export branch pager content as collapsed details for readability in exported file
    if(Array.isArray(m.branches) && m.branches.length){
      body += `<details class="branch"><summary>回溯分支（共 ${m.branches.length} 条路径，点展开）</summary><div class="branch-inner">`;
      m.branches.forEach((thread,i)=>{
        body += `<div class="branch-path"><div class="chip">分支 ${i+1}/${m.branches.length}</div></div>`;
        thread.forEach(b=>{
          const ts2 = b.ts ? new Date(b.ts*1000).toLocaleString() : '';
          body += metaLine(b.role, ts2, b.model||'', b.content||'');
          body += bubble(b.role, b.content||'');
        });
      });
      body += `</div></details>`;
    }
  });

  const html = `<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>${esc(c.title||'导出')}</title>
<style>
:root{${cssVars};--corner:18px}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:var(--bg-light);color:var(--text-light)}

.align-center{margin-left:auto;margin-right:auto;text-align:center}

.msg{max-width:var(--bubble-max);border-radius:var(--corner);padding:.55rem .72rem;line-height:1.55;white-space:pre-wrap;box-shadow:0 1px 0 rgba(0,0,0,.03)}

  try{
    const blob = new Blob([html], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${(c.title||'chat_export').replace(/[\\/:*?"<>|]/g,'_')}.html`;
    setTimeout(()=>{
      a.click();
      URL.revokeObjectURL(url);
    },0);

    toast('导出失败：'+(err?.message||String(err)));
  }

/* ========= Apply prefs on load ========= */
(function init(){
  // theme
  const isDark = !!prefs.dark;
  document.body.classList.toggle('dark', isDark);
  document.getElementById('btnTheme').textContent = isDark ? '日间' : '夜间';

  // colors
  if(prefs.colors?.user) setCSS('--user', prefs.colors.user);
  if(prefs.colors?.system) setCSS('--system', prefs.colors.system);
  cUser.value = prefs.colors?.user || '#0a84ff';
  cSys.value  = prefs.colors?.system || '#af52de';

  // bubble
  const bw = prefs.bubble || 86;
  rngBubble.value = bw;
  setBubbleWidth(bw);

  // names
  nmUser.value = prefs.names?.user || '';
  nmAsst.value = prefs.names?.assistant || '';
  nmSys.value  = prefs.names?.system || '';

  // panel state
  if(prefs.panelOpen){
    panel.classList.add('open');
  }

  // title
  if(prefs.pageTitle){
    document.title = prefs.pageTitle;
    navTitle.textContent = prefs.pageTitle;
  }else{
    navTitle.textContent = document.title || 'Chat Viewer';
  }

  // initial mode
  setMode('chats');

  // drawer list
  buildDrawerList();

  // layout
  layoutTick();
  setTimeout(layoutTick, 120);
})();

/* ========= Title click to rename (small convenience) ========= */
navTitle.addEventListener('click', ()=>{
  const cur = document.title || 'Chat Viewer';
  const next = prompt('修改页面标题（标签栏显示）', cur);
  if(next && next.trim()){
    document.title = next.trim();
    navTitle.textContent = next.trim();
    prefs.pageTitle = next.trim();
    savePrefs();
    toast('已修改标题');
  }
});

/* ========= Panel height tracking ========= */
const panelObserver = new MutationObserver(()=>layoutTick());
panelObserver.observe(panel, {attributes:true, attributeFilter:['class']});

/* ========= Keep drawer buttons consistent ========= */
drawerMode='chats';
buildDrawerList();
</script>
</body>
</html>
