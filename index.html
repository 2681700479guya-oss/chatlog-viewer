<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>聊天记录查看器</title>

<style>
:root{
  --vh: 1vh;
  --header-h: 52px;
  --footer-h: 62px;
  --panel-h: 0px;

  --bg-light:#f2f2f7;
  --bg-dark:#000000;
  --card-light:#ffffff;
  --card-dark:#1c1c1e;

  --sep-light: rgba(60,60,67,.18);
  --sep-dark:  rgba(84,84,88,.35);

  --text-light:#111111;
  --text-dark:#ffffff;
  --muted-light: rgba(60,60,67,.60);
  --muted-dark:  rgba(235,235,245,.60);

  --user:#0a84ff;
  --assistant-card-light:#ffffff;
  --assistant-card-dark:#1c1c1e;
  --system:#af52de;

  --chip-light: rgba(0,0,0,.06);
  --chip-dark:  rgba(255,255,255,.10);

  --bubble-max: 86%;
  --corner: 18px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg-light);
  color:var(--text-light);
  overflow:hidden;
  overscroll-behavior:none;
  height:100dvh;
  height:calc(var(--vh, 1vh) * 100);
}
body.dark{background:var(--bg-dark);color:var(--text-dark)}

/* 顶栏 */
header{
  position:fixed; left:0; right:0; top:0;
  z-index:80;
  backdrop-filter:saturate(180%) blur(12px);
  background:color-mix(in oklab, #fff 88%, transparent);
  border-bottom:1px solid var(--sep-light);
  padding-top: calc(env(safe-area-inset-top) + .26rem);
  padding-bottom:.26rem;
  padding-left:.55rem;
  padding-right:.55rem;
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:.55rem;
}
body.dark header{
  background:color-mix(in oklab, #1c1c1e 88%, transparent);
  border-bottom-color:var(--sep-dark);
}
.h-left{display:flex; align-items:center; gap:.50rem; min-width:0}
.h-title{
  font-weight:650; font-size:.96rem;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition:opacity .2s, transform .2s;
}
.h-right{display:flex; gap:.42rem; align-items:center; flex-wrap:nowrap}

/* 按钮 */
.btn{
  border:1px solid var(--sep-light);
  background:color-mix(in oklab, #fff 92%, transparent);
  color:inherit;
  border-radius:999px;
  padding:.30rem .56rem;
  font-size:.84rem;
  cursor:pointer;
}
body.dark .btn{
  border-color:var(--sep-dark);
  background:color-mix(in oklab, #2c2c2e 90%, transparent);
}
.btn:active{transform:scale(.98)}
.btn-ghost{
  border:none;
  background:transparent;
  color:inherit;
  font-size:1.02rem;
  padding:.12rem .22rem;
  border-radius:10px;
}
.btn-ghost:active{transform:scale(.98)}
.btn.active{
  background:color-mix(in oklab, var(--user) 14%, transparent);
  border-color:color-mix(in oklab, var(--user) 30%, transparent);
}

/* 顶部面板 */
#panel{
  position:fixed; left:0; right:0;
  top:var(--header-h);
  z-index:75;
  display:none;
}
#panel.open{display:block}
.panel-inner{
  border-bottom:1px solid var(--sep-light);
  background:color-mix(in oklab, #fff 92%, transparent);
  backdrop-filter:saturate(180%) blur(10px);
  padding:.56rem .70rem;
}
body.dark .panel-inner{
  border-bottom-color:var(--sep-dark);
  background:color-mix(in oklab, #1c1c1e 92%, transparent);
}
.tabs{display:flex; gap:.5rem; align-items:center; margin-bottom:.18rem}
.pill{
  padding:.22rem .66rem;
  border-radius:999px;
  border:1px solid var(--sep-light);
  background:color-mix(in oklab, #fff 88%, transparent);
  cursor:pointer;
  font-weight:700;
  font-size:.84rem;
}
body.dark .pill{
  border-color:var(--sep-dark);
  background:color-mix(in oklab, #2c2c2e 88%, transparent);
}
.pill.active{
  border-color:color-mix(in oklab, var(--user) 40%, transparent);
  background:color-mix(in oklab, var(--user) 14%, transparent);
}
.row{display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin:.16rem 0}
.badge{
  font-size:.75rem; font-weight:650;
  padding:.12rem .42rem; border-radius:999px;
  border:1px solid var(--sep-light);
  background:color-mix(in oklab, #fff 88%, transparent);
}
body.dark .badge{
  border-color:var(--sep-dark);
  background:color-mix(in oklab, #2c2c2e 88%, transparent);
}
input[type="text"], select, textarea, input[type="range"]{
  font-size:.85rem;
  padding:.30rem .52rem;
  border-radius:999px;
  border:1px solid var(--sep-light);
  background:color-mix(in oklab, #fff 92%, transparent);
  color:inherit;
}
textarea{border-radius:14px;width:100%;padding:.55rem .6rem;line-height:1.45}
body.dark input[type="text"], body.dark select, body.dark textarea, body.dark input[type="range"]{
  border-color:var(--sep-dark);
  background:color-mix(in oklab, #2c2c2e 90%, transparent);
}
.colorbox{display:flex; gap:.45rem; align-items:center}
.colorbox label{font-size:.78rem; opacity:.85}
.colorbox input[type="color"]{width:30px;height:26px;border:none;background:transparent}

/* 抽屉 */
#drawerBackdrop{
  position:fixed; inset:0;
  background:rgba(0,0,0,.25);
  opacity:0; pointer-events:none;
  transition:.2s;
  z-index:60;
}
#drawerBackdrop.show{opacity:1; pointer-events:auto}
#drawer{
  position:fixed;
  left:0;
  top:var(--header-h);
  bottom:var(--footer-h);
  width:290px;
  background:var(--card-light);
  border-right:1px solid var(--sep-light);
  box-shadow:8px 0 24px rgba(0,0,0,.12);
  transform:translateX(-100%);
  transition:transform .25s ease;
  z-index:70;
  display:flex; flex-direction:column;
}
body.dark #drawer{
  background:var(--card-dark);
  border-right-color:var(--sep-dark);
  box-shadow:8px 0 24px rgba(0,0,0,.45);
}
#drawer.open{transform:translateX(0)}
.drawer-head{
  padding:.66rem .75rem;
  border-bottom:1px solid var(--sep-light);
  display:flex; align-items:center; justify-content:space-between; gap:.6rem;
}
body.dark .drawer-head{border-bottom-color:var(--sep-dark)}
.drawer-title{font-weight:750}
.drawer-list{
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  padding:.45rem;
  flex:1;
}
.item{
  padding:.52rem .62rem;
  border-radius:12px;
  border:1px solid transparent;
  cursor:pointer;
  user-select:none;
}
.item:hover{background:color-mix(in oklab,currentColor 6%,transparent)}
.item.active{
  background:color-mix(in oklab, var(--user) 10%, transparent);
  border-color:color-mix(in oklab, var(--user) 30%, transparent);
}
.item .sub{
  margin-top:.14rem;
  font-size:.74rem;
  color:var(--muted-light);
}
body.dark .item .sub{color:var(--muted-dark)}

/* 内容区 */
main{
  position:fixed;
  left:0; right:0;
  top:calc(var(--header-h) + var(--panel-h));
  bottom:var(--footer-h);
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:.70rem .62rem 1rem .62rem;
}
.container{
  max-width:980px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:.62rem;
  overflow-anchor:none;
}

.section-title{
  font-weight:850;
  margin:.22rem 0 .35rem 0;
  font-size:1.02rem;
}
.muted{color:var(--muted-light); line-height:1.6}
body.dark .muted{color:var(--muted-dark)}

/* 气泡与 meta */
.meta, .name{
  font-size:.72rem;
  color:var(--muted-light);
}
body.dark .meta, body.dark .name{color:var(--muted-dark)}
.meta{display:flex; gap:.45rem; flex-wrap:wrap; margin:.05rem .18rem}
.name{margin:0 .18rem .18rem .18rem}

.align-right{margin-left:auto;text-align:right}
.align-left{margin-right:auto;text-align:left}
.align-center{margin-left:auto;margin-right:auto;text-align:center}

.chip{
  padding:.08rem .4rem;
  border-radius:999px;
  background:var(--chip-light);
  border:1px solid var(--sep-light);
}
body.dark .chip{
  background:var(--chip-dark);
  border-color:var(--sep-dark);
}

.msg-wrap{
  display:flex;
  gap:.35rem;
  align-items:flex-start;
  max-width:100%;
}
.msg-tools{
  display:none;
  flex-direction:column;
  gap:.25rem;
  margin-top:.05rem;
}
.toolbtn{
  border:1px solid var(--sep-light);
  background:color-mix(in oklab, #fff 92%, transparent);
  border-radius:999px;
  padding:.16rem .52rem;
  font-size:.78rem;
  cursor:pointer;
}
body.dark .toolbtn{
  border-color:var(--sep-dark);
  background:color-mix(in oklab, #2c2c2e 92%, transparent);
}
.toolbtn:active{transform:scale(.98)}

.msg{
  max-width:var(--bubble-max);
  border-radius:var(--corner);
  padding:.55rem .72rem;
  line-height:1.55;
  white-space:pre-wrap;
  box-shadow:0 1px 0 rgba(0,0,0,.03);
  user-select:text;
}
.msg.user{
  background:var(--user);
  color:#fff;
  margin-left:auto;
  box-shadow:0 1px 0 rgba(10,132,255,.25);
}
.msg.assistant{
  background:var(--assistant-card-light);
  color:#111;
  margin-right:auto;
  box-shadow:0 1px 0 rgba(0,0,0,.04);
}
body.dark .msg.assistant{
  background:var(--assistant-card-dark);
  color:#fff;
  box-shadow:0 1px 0 rgba(0,0,0,.28);
}
.msg.system{
  background:color-mix(in oklab, var(--system) 20%, transparent);
  border:1px solid color-mix(in oklab, var(--system) 26%, transparent);
  color:color-mix(in oklab, #111 60%, var(--system) 40%);
  margin-left:auto; margin-right:auto;
  box-shadow:none;
}
body.dark .msg.system{
  color:color-mix(in oklab, #fff 70%, var(--system) 30%);
}
.edit-mode .msg-tools{display:flex}

/* 回溯分支（默认收起，放在 AI 气泡侧） */
.branch-wrap{
  max-width:var(--bubble-max);
  margin:.15rem 0 .35rem 0;
  margin-right:auto;
}
.branch-bar{
  display:flex; align-items:center; justify-content:space-between;
  gap:.45rem;
  padding:.34rem .50rem;
  border-radius:14px;
  border:1px dashed color-mix(in oklab, var(--user) 42%, transparent);
  background:color-mix(in oklab, var(--user) 8%, transparent);
  user-select:none;
}
.branch-bar .mini{font-size:.78rem; font-weight:750}
.branch-bar .hint{font-size:.74rem; color:var(--muted-light)}
body.dark .branch-bar .hint{color:var(--muted-dark)}
.bbtn{
  border:1px solid var(--sep-light);
  background:color-mix(in oklab, #fff 92%, transparent);
  border-radius:999px;
  padding:.16rem .52rem;
  font-size:.85rem;
  cursor:pointer;
}
body.dark .bbtn{
  border-color:var(--sep-dark);
  background:color-mix(in oklab, #2c2c2e 92%, transparent);
}
.branch-view{
  margin-top:.35rem;
  padding:.45rem .55rem;
  border-radius:14px;
  background:color-mix(in oklab, #fff 78%, transparent);
  border:1px solid var(--sep-light);
}
body.dark .branch-view{
  background:color-mix(in oklab, #1c1c1e 78%, transparent);
  border-color:var(--sep-dark);
}
.branch-view .msg{max-width:100%}

/* 记忆卡片 */
.card{
  background:var(--card-light);
  border:1px solid var(--sep-light);
  border-radius:14px;
  padding:.65rem .7rem;
}
body.dark .card{
  background:var(--card-dark);
  border-color:var(--sep-dark);
}
.mem-line{white-space:pre-wrap; line-height:1.5}
.mem-actions{display:flex; gap:.45rem; flex-wrap:wrap; margin-top:.45rem}
.mem-actions .btn{padding:.20rem .56rem}

/* 底部Tab（单行无重叠） */
footer{
  position:fixed; left:0; right:0; bottom:0;
  z-index:85;
  backdrop-filter:saturate(180%) blur(12px);
  background:color-mix(in oklab, #fff 88%, transparent);
  border-top:1px solid var(--sep-light);
  padding-bottom: calc(env(safe-area-inset-bottom) + .14rem);
  padding-top: .22rem;
  padding-left:.32rem;
  padding-right:.32rem;
  display:flex;
  align-items:center;
  justify-content:space-around;
  gap:.25rem;
}
body.dark footer{
  background:color-mix(in oklab, #1c1c1e 88%, transparent);
  border-top-color:var(--sep-dark);
}
.tab{
  display:flex; align-items:center; justify-content:center;
  font-size:.78rem;
  color:var(--muted-light);
  min-width:74px;
  padding:.46rem .25rem;
  border-radius:12px;
  cursor:pointer;
  user-select:none;
}
body.dark .tab{color:var(--muted-dark)}
.tab.active{
  color:color-mix(in oklab, var(--user) 65%, #111 35%);
  background:color-mix(in oklab, var(--user) 10%, transparent);
}
body.dark .tab.active{
  color:color-mix(in oklab, var(--user) 70%, #fff 30%);
}

/* Toast */
#toast{
  position:fixed; left:0; right:0;
  bottom:calc(var(--footer-h) + 10px);
  z-index:95;
  display:none;
  justify-content:center;
  pointer-events:none;
}
#toast.show{display:flex}
.toast-inner{
  max-width:92vw;
  background:rgba(30,30,30,.92);
  color:#fff;
  padding:.48rem .72rem;
  border-radius:12px;
  font-size:.86rem;
}

/* 选区浮层按钮（加入记忆） */
#selFloat{
  position:fixed;
  z-index:110;
  display:none;
}
#selFloat.show{display:block}
.sel-btn{
  border:1px solid rgba(255,255,255,.25);
  background:rgba(30,30,30,.92);
  color:#fff;
  border-radius:999px;
  padding:.32rem .68rem;
  font-size:.85rem;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}

/* 底部编辑 Sheet */
#sheetBackdrop{
  position:fixed; inset:0;
  background:rgba(0,0,0,.25);
  opacity:0; pointer-events:none;
  transition:.2s;
  z-index:120;
}
#sheetBackdrop.show{opacity:1; pointer-events:auto}
#sheet{
  position:fixed;
  left:0; right:0;
  bottom:0;
  transform:translateY(100%);
  transition:transform .25s ease;
  z-index:130;
  padding-bottom: calc(env(safe-area-inset-bottom) + .35rem);
}
#sheet.show{transform:translateY(0)}
.sheet-inner{
  margin:.5rem .5rem 0 .5rem;
  background:var(--card-light);
  border:1px solid var(--sep-light);
  border-radius:16px;
  overflow:hidden;
}
body.dark .sheet-inner{
  background:var(--card-dark);
  border-color:var(--sep-dark);
}
.sheet-head{
  display:flex; justify-content:space-between; align-items:center;
  gap:.5rem;
  padding:.52rem .62rem;
  border-bottom:1px solid var(--sep-light);
}
body.dark .sheet-head{border-bottom-color:var(--sep-dark)}
.sheet-title{font-weight:800}
.sheet-body{padding:.6rem .62rem}
.sheet-body textarea{min-height:42vh}
.sheet-foot{
  display:flex; gap:.5rem; justify-content:flex-end;
  padding:.52rem .62rem;
  border-top:1px solid var(--sep-light);
}
body.dark .sheet-foot{border-top-color:var(--sep-dark)}

/* 宽屏：抽屉常驻 */
@media (min-width:1100px){
  #drawer{transform:translateX(0)}
  #drawerBackdrop{display:none}
  main{left:290px}
  header{left:290px}
  footer{left:290px}
  #panel{left:290px}
}
</style>
</head>

<body>
<header id="header">
  <div class="h-left">
    <button class="btn-ghost" id="btnDrawer" aria-label="菜单">≡</button>
    <div class="h-title" id="navTitle">聊天记录查看器</div>
  </div>

  <div class="h-right">
    <input id="file" type="file" accept=".json" multiple style="display:none" />
    <button class="btn" id="btnImport">导入</button>
    <button class="btn" id="btnExport">导出</button>
    <button class="btn" id="btnSettings">设置</button>
    <button class="btn" id="btnTheme">夜间</button>
  </div>
</header>

<div id="panel">
  <div class="panel-inner" id="panelInner">
    <div class="tabs">
      <div class="pill" id="pillExport">导出</div>
      <div class="pill" id="pillSettings">设置</div>
    </div>

    <div id="panelExport">
      <div class="row">
        <span class="badge">导出格式</span>
        <select id="expFmt">
          <option value="txt">TXT（清晰排版）</option>
          <option value="json">JSON（结构化）</option>
          <option value="html">HTML（带气泡样式）</option>
        </select>
        <button class="btn" id="btnDoExport">导出当前页面</button>
      </div>
      <div class="row">
        <span class="badge">规则</span>
        <span class="muted" id="expHint">导出你当前正在看的页面内容（聊天/编辑/记忆）。</span>
      </div>
    </div>

    <div id="panelSettings" style="display:none">
      <div class="row">
        <span class="badge">会话</span>
        <select id="selConv"></select>
        <span class="badge" id="convMeta">未导入</span>
      </div>

      <div class="row">
        <span class="badge">气泡宽度</span>
        <input type="range" id="rngBubble" min="60" max="100" value="86" />
        <span class="badge" id="txtBubble">86%</span>
      </div>

      <div class="row">
        <span class="badge">颜色</span>
        <div class="colorbox">
          <label>用户</label><input type="color" id="cUser" />
          <label>系统</label><input type="color" id="cSys" />
        </div>
        <button class="btn" id="btnReset">恢复默认</button>
      </div>

      <div class="row">
        <span class="badge">显示名</span>
        <input type="text" id="nmUser" placeholder="用户显示名" style="width:8.5rem">
        <input type="text" id="nmAsst" placeholder="助手显示名" style="width:8.5rem">
        <input type="text" id="nmSys"  placeholder="系统显示名" style="width:8.5rem">
        <button class="btn" id="btnSaveNames">保存</button>
      </div>

      <div class="row">
        <span class="badge">记忆</span>
        <span class="badge" id="memMeta">0 条</span>
        <button class="btn" id="btnNewMem">新建记忆</button>
      </div>

      <div class="row">
        <span class="badge">说明</span>
        <span class="muted">
          记忆仅来自 memories.json 或 conversations.json 的明确结构字段（白名单）。不会从“已更新记忆”提示文本猜测。
        </span>
      </div>
    </div>
  </div>
</div>

<div id="drawerBackdrop"></div>
<aside id="drawer">
  <div class="drawer-head">
    <div class="drawer-title">会话列表</div>
    <button class="btn" id="btnCloseDrawer">关闭</button>
  </div>
  <div class="drawer-list" id="drawerList"></div>
</aside>

<main id="main">
  <div class="container" id="view">
    <div class="section-title">聊天</div>
    <div class="muted">
      用法：点右上“导入”，选择 conversations.json（可多选）。如果你的导出包里有 memories.json，也可以一起导入。<br>
      导出：会导出你当前正在看的页面内容。
    </div>
  </div>
</main>

<footer>
  <div class="tab active" id="tabChats">聊天</div>
  <div class="tab" id="tabEdit">编辑</div>
  <div class="tab" id="tabMems">记忆</div>
</footer>

<div id="toast"><div class="toast-inner" id="toastText"></div></div>

<!-- 选区浮层按钮 -->
<div id="selFloat"><button class="sel-btn" id="btnSelToMem">加入记忆</button></div>

<!-- 编辑/记忆编辑 Sheet -->
<div id="sheetBackdrop"></div>
<div id="sheet">
  <div class="sheet-inner">
    <div class="sheet-head">
      <div class="sheet-title" id="sheetTitle">编辑</div>
      <button class="btn" id="sheetClose">关闭</button>
    </div>
    <div class="sheet-body">
      <textarea id="sheetText" placeholder="在此编辑内容…"></textarea>
      <div class="muted" style="margin-top:.35rem" id="sheetMeta"></div>
    </div>
    <div class="sheet-foot">
      <button class="btn" id="sheetCancel">取消</button>
      <button class="btn" id="sheetDone">完成</button>
    </div>
  </div>
</div>

<script>
/* ===== 基础工具 ===== */
function toast(msg){
  const t=document.getElementById('toast');
  document.getElementById('toastText').textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3200);
}
function escapeHTML(s){
  return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function safeName(name){
  return (name||'export').replace(/[\\/:*?"<>|]/g,'_').trim() || 'export';
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

/* ===== 会话解析 ===== */
function parseConversations(data){
  const out = [];
  if(Array.isArray(data)){
    data.forEach(obj=>{ const c=parseConversation(obj); if(c) out.push(c); });
  }else if(data && typeof data==='object'){
    if(Array.isArray(data.items)){
      data.items.forEach(obj=>{ const c=parseConversation(obj); if(c) out.push(c); });
    }else{
      const c=parseConversation(data); if(c) out.push(c);
    }
  }
  return out;
}
function parseConversation(obj){
  const title = obj.title || obj.gist || obj.name || '';
  const created = obj.create_time || obj.update_time || obj.created || 0;

  const mapping = obj.mapping;
  const current = obj.current_node;

  if(mapping && current){
    const pathIds=[];
    let nodeId=current;
    while(nodeId && mapping[nodeId]){
      pathIds.push(nodeId);
      nodeId = mapping[nodeId].parent || null;
    }
    pathIds.reverse();
    const pathSet=new Set(pathIds);

    const messages=[];
    pathIds.forEach(pid=>{
      const node=mapping[pid];
      const m=normalizeNodeMessage(node);
      if(m) messages.push(m);
    });

    const idToIndex=new Map();
    messages.forEach((m,i)=>idToIndex.set(m._nodeId,i));

    // branches
    pathIds.forEach(pid=>{
      const node=mapping[pid];
      const children=Array.isArray(node.children)?node.children:[];
      const branchKids=children.filter(cid=>!pathSet.has(cid));
      if(!branchKids.length) return;

      const threads=[];
      for(const kid of branchKids){
        const thread = collectBranchThread(mapping, kid, 140);
        if(thread.length) threads.push(thread);
      }
      if(!threads.length) return;

      const at=idToIndex.get(pid);
      if(typeof at!=='number') return;

      const curMsg = messages[at];
      if(curMsg.role === 'user'){
        let j = at+1;
        while(j < messages.length && messages[j].role !== 'assistant') j++;
        if(j < messages.length){
          messages[j].branches = (messages[j].branches||[]).concat(threads);
        }else{
          curMsg.branches = (curMsg.branches||[]).concat(threads);
        }
      }else{
        curMsg.branches = (curMsg.branches||[]).concat(threads);
      }
    });

    const cleaned = messages
      .filter(m=>m.content && m.content.trim().length)
      .map((m, idx)=>({ ...m, _msgIndex: idx }));
    return {id:obj.id||crypto.randomUUID(), title, created, messages:cleaned, totalChars:0};
  }

  if(Array.isArray(obj.messages)){
    const msgs=obj.messages.map(normalizeLinearMessage).filter(Boolean);
    return {id:obj.id||crypto.randomUUID(), title, created, messages:msgs, totalChars:0};
  }
  return null;
}

function normalizeLinearMessage(m){
  const role=m.role||(m.author?.role)||"assistant";
  const parts=Array.isArray(m.content?.parts)?m.content.parts.join("\n"):(m.content?.text||m.content||"");
  const content=typeof parts==='string'?parts:JSON.stringify(parts);
  const model=m.model||m.metadata?.model_slug||m.metadata?.model||"";
  const ts=m.create_time||m.ts||0;
  const msgId = m.id || m.message_id || crypto.randomUUID();
  return {id:msgId, role,content,model,ts,branches:[],meta:m.metadata||{}, _msgIndex:0};
}

function normalizeNodeMessage(node){
  const msg=node.message;
  if(!msg || !msg.author) return null;
  const role=msg.author.role||"assistant";
  if(!["user","assistant","system"].includes(role)) return null;

  let text="";
  if(Array.isArray(msg.content?.parts)) text=msg.content.parts.join("\n");
  else if(typeof msg.content?.text==='string') text=msg.content.text;
  else if(typeof msg.content==='string') text=msg.content;

  const model=msg.metadata?.model_slug||msg.metadata?.model||msg.model_slug||msg.model||"";
  const ts=msg.create_time||node.create_time||0;
  const msgId = msg.id || msg.message_id || node.id || crypto.randomUUID();

  return {id:msgId, role,content:text||"",model,ts,branches:[],_nodeId:node.id,meta:msg.metadata||{}};
}

function collectBranchThread(mapping, startId, limit=140){
  const thread=[];
  let id=startId;
  let safety=0;
  while(id && mapping[id] && safety<limit){
    safety++;
    const node=mapping[id];
    const m=normalizeNodeMessage(node);
    if(m && m.content && m.content.trim().length){
      thread.push({role:m.role, content:m.content, ts:m.ts, model:m.model, meta:m.meta||{}});
    }
    const kids = Array.isArray(node.children)?node.children:[];
    if(kids.length!==1) break;
    id = kids[0];
  }
  return thread;
}

/* ===== 结构化记忆解析 ===== */
function parseMemories(data){
  let arr=[];
  if(Array.isArray(data)) arr=data;
  else if(data && typeof data==='object'){
    if(Array.isArray(data.items)) arr=data.items;
    else if(Array.isArray(data.memories)) arr=data.memories;
    else if(Array.isArray(data.data)) arr=data.data;
  }
  const out=[];
  for(const it of arr){
    if(typeof it === 'string'){
      out.push(makeMem({title:'', text:it, created:0, source:'memories.json', from:null}));
      continue;
    }
    if(!it || typeof it!=='object') continue;
    const text = it.memory || it.text || it.content || it.value || it.summary || '';
    if(!text) continue;
    const title = it.title || it.name || '';
    out.push(makeMem({
      title: String(title||'').trim(),
      text: String(text),
      created: it.created_at || it.create_time || it.timestamp || 0,
      source:'memories.json',
      from: null
    }));
  }
  return out;
}

/* conversations.json：只接受白名单字段 */
function extractStructuredMemoriesFromConversations(convs){
  const out=[];
  const seen=new Set();
  const keys = [
    'memories','memory','saved_memory','saved_memories','user_memory','user_memories',
    'personal_memory','profile_memory'
  ];

  for(const c of (convs||[])){
    for(let i=0;i<(c.messages||[]).length;i++){
      const m=c.messages[i];
      const meta = m.meta;
      if(!meta || typeof meta!=='object') continue;

      for(const k of keys){
        if(!(k in meta)) continue;
        const v = meta[k];
        const from = {
          convId: c.id,
          convTitle: c.title||'',
          msgId: m.id,
          msgIndex: i
        };

        const pushText = (t)=>{
          const text = String(t||'').trim();
          if(!text) return;
          if(seen.has(text)) return;
          seen.add(text);
          out.push(makeMem({
            title:'',
            text,
            created: m.ts||0,
            source:`conversations.meta.${k}`,
            from
          }));
        };

        if(typeof v === 'string') pushText(v);
        else if(Array.isArray(v)) v.forEach(x=>{
          if(typeof x==='string') pushText(x);
          else if(x && typeof x==='object'){
            const tt = x.text || x.content || x.value || x.memory || x.summary;
            if(typeof tt==='string') pushText(tt);
          }
        });
        else if(v && typeof v === 'object'){
          const tt = v.text || v.content || v.value || v.memory || v.summary;
          if(typeof tt==='string') pushText(tt);
        }
      }
    }
  }
  return out;
}

function makeMem({title,text,created,source,from}){
  return {
    id: crypto.randomUUID(),
    title: String(title||'').trim(),
    text: String(text||''),
    created: Number(created||0),
    source: source||'',
    from: from || null
  };
}

/* 记忆严格去重（正文完全一致即拒绝） */
function addMemory(mem, {silent=false}={}){
  const text = (mem.text||'').trim();
  if(!text) return false;

  const exists = memories.some(x => (x.text||'').trim() === text);
  if(exists){
    if(!silent) toast('记忆重复，已忽略');
    return false;
  }
  if(!mem.title){
    const head = text.replace(/\s+/g,' ').slice(0, 24);
    mem.title = head || '未命名';
  }
  memories.unshift(mem);
  lastTouchedMemId = mem.id;
  updateMemMeta();
  return true;
}

/* ===== 渲染聊天/编辑 ===== */
function getConv(){ return conversations[currentConv] || null; }
function roleClass(role){
  if(role==='user') return 'user';
  if(role==='system') return 'system';
  return 'assistant';
}
function getRenderedText(convId, msg){
  const d = drafts[convId];
  if(!d || !d.overrides) return msg.content || '';
  const t = d.overrides[msg.id];
  return (typeof t === 'string') ? t : (msg.content||'');
}
function setOverride(convId, msgId, newText){
  drafts[convId] = drafts[convId] || {overrides:{}, updatedAt:0};
  drafts[convId].overrides = drafts[convId].overrides || {};
  drafts[convId].overrides[msgId] = String(newText||'');
  drafts[convId].updatedAt = Date.now();
  saveDrafts();
}

function renderChats({editable=false}={}){
  view.classList.toggle('edit-mode', editable);
  view.innerHTML='';

  const title = document.createElement('div');
  title.className='section-title';
  title.textContent = editable ? '编辑' : '聊天';
  view.appendChild(title);

  const c = getConv();
  if(!c){
    view.innerHTML += `<div class="muted">还没有导入会话。点右上“导入”。</div>`;
    return;
  }

  const hint = document.createElement('div');
  hint.className='muted';
  hint.innerHTML = editable
    ? '编辑页：每条气泡旁有“编辑”。只改变本地覆盖层，不改原始 JSON。导出会导出编辑后的版本。'
    : '聊天页：选中文字后会出现“加入记忆”的浮层按钮。长按气泡空白处可复制整段。导出会导出原始版本。';
  view.appendChild(hint);

  c.messages.forEach((m, idx)=>{
    const name=displayName(m.role);
    if(name){
      const nm=document.createElement('div');
      nm.className='name ' + (m.role==='user'?'align-right':m.role==='assistant'?'align-left':'align-center');
      nm.textContent=name;
      view.appendChild(nm);
    }

    const shownText = editable ? getRenderedText(c.id, m) : (m.content||'');
    const meta=document.createElement('div');
    meta.className='meta ' + (m.role==='user'?'align-right':m.role==='assistant'?'align-left':'align-center');
    const ts = m.ts ? new Date(m.ts*1000).toLocaleString() : '';
    const model = m.model || '';
    meta.innerHTML = `${ts?`<span>${escapeHTML(ts)}</span>`:''}
                      ${model?`<span class="chip">${escapeHTML(model)}</span>`:''}
                      <span>字数：${(shownText||'').length}</span>`;
    view.appendChild(meta);

    const wrap=document.createElement('div');
    wrap.className='msg-wrap ' + (m.role==='user'?'align-right':m.role==='assistant'?'align-left':'align-center');

    const tools=document.createElement('div');
    tools.className='msg-tools';

    if(editable){
      const eb=document.createElement('button');
      eb.className='toolbtn';
      eb.textContent='编辑';
      eb.onclick=()=> openMessageEditor({conv:c, msg:m, idx});
      tools.appendChild(eb);

      const rb=document.createElement('button');
      rb.className='toolbtn';
      rb.textContent='还原';
      rb.onclick=()=>{
        if(drafts[c.id]?.overrides?.[m.id] !== undefined){
          delete drafts[c.id].overrides[m.id];
          drafts[c.id].updatedAt = Date.now();
          saveDrafts();
          renderChats({editable:true});
          toast('已还原该条为原文');
        }
      };
      tools.appendChild(rb);
    }

    const bubble=document.createElement('div');
    bubble.className='msg ' + roleClass(m.role);
    bubble.innerText = shownText || '';
    bubble.dataset.convId = c.id;
    bubble.dataset.msgId  = m.id;
    bubble.dataset.msgIndex = String(idx);

    // 长按空白复制整段（不抢选词）
    attachLongPress(bubble, ()=>{
      const sel = window.getSelection();
      if(sel && String(sel).trim()) return;
      copyText(shownText||'');
    });

    // 排版顺序：AI 左侧工具在气泡外侧；用户右侧工具在气泡外侧
    if(m.role==='assistant'){
      wrap.appendChild(tools);
      wrap.appendChild(bubble);
    }else if(m.role==='user'){
      wrap.appendChild(bubble);
      wrap.appendChild(tools);
    }else{
      wrap.appendChild(bubble);
    }

    view.appendChild(wrap);

    // 回溯：放在 AI 侧，并挂在 AI 气泡后
    if(m.role==='assistant' && Array.isArray(m.branches) && m.branches.length){
      const bwrap=document.createElement('div');
      bwrap.className='branch-wrap';

      const bar=document.createElement('div');
      bar.className='branch-bar';

      const leftBtn=document.createElement('button');
      leftBtn.className='bbtn';
      leftBtn.textContent='<';

      const mid=document.createElement('div');
      mid.style.display='flex';
      mid.style.flexDirection='column';
      mid.style.gap='.1rem';

      const mini=document.createElement('div');
      mini.className='mini';
      mini.textContent = `＜1/${m.branches.length}＞`;

      const hint2=document.createElement('div');
      hint2.className='hint';
      hint2.textContent='回溯分支（点展开查看）';

      mid.appendChild(mini);
      mid.appendChild(hint2);

      const rightBtn=document.createElement('button');
      rightBtn.className='bbtn';
      rightBtn.textContent='>';

      const toggleBtn=document.createElement('button');
      toggleBtn.className='bbtn';
      toggleBtn.textContent='展开';

      bar.appendChild(leftBtn);
      bar.appendChild(mid);
      bar.appendChild(rightBtn);
      bar.appendChild(toggleBtn);

      const viewBox=document.createElement('div');
      viewBox.className='branch-view';
      viewBox.style.display='none';

      let page=0;

      function renderBranchPage(){
        mini.textContent = `＜${page+1}/${m.branches.length}＞`;
        viewBox.innerHTML='';
        const thread = m.branches[page] || [];
        if(!thread.length){
          viewBox.innerHTML = `<div class="muted">（该分支暂无可显示内容）</div>`;
          return;
        }
        thread.forEach(b=>{
          const meta2=document.createElement('div');
          meta2.className='meta ' + (b.role==='user'?'align-right':b.role==='assistant'?'align-left':'align-center');
          const ts2 = b.ts ? new Date(b.ts*1000).toLocaleString() : '';
          const model2 = b.model || '';
          meta2.innerHTML = `${ts2?`<span>${escapeHTML(ts2)}</span>`:''}
                            ${model2?`<span class="chip">${escapeHTML(model2)}</span>`:''}
                            <span>字数：${(b.content||'').length}</span>`;
          viewBox.appendChild(meta2);

          const bb=document.createElement('div');
          bb.className='msg ' + roleClass(b.role);
          bb.innerText = b.content || '';
          viewBox.appendChild(bb);
        });
      }

      leftBtn.onclick=()=>{
        page = (page - 1 + m.branches.length) % m.branches.length;
        if(viewBox.style.display !== 'none') renderBranchPage();
        mini.textContent = `＜${page+1}/${m.branches.length}＞`;
      };
      rightBtn.onclick=()=>{
        page = (page + 1) % m.branches.length;
        if(viewBox.style.display !== 'none') renderBranchPage();
        mini.textContent = `＜${page+1}/${m.branches.length}＞`;
      };
      toggleBtn.onclick=()=>{
        const open = viewBox.style.display !== 'none';
        if(open){
          viewBox.style.display='none';
          toggleBtn.textContent='展开';
          hint2.textContent='回溯分支（点展开查看）';
        }else{
          renderBranchPage();
          viewBox.style.display='block';
          toggleBtn.textContent='收起';
          hint2.textContent='左右翻页切换分支';
        }
      };

      bwrap.appendChild(bar);
      bwrap.appendChild(viewBox);
      view.appendChild(bwrap);
    }
  });

  updateConvMeta();
}

/* ===== 渲染记忆 ===== */
function renderMems(){
  view.classList.remove('edit-mode');
  view.innerHTML='';

  const title=document.createElement('div');
  title.className='section-title';
  title.textContent='记忆';
  view.appendChild(title);

  const info=document.createElement('div');
  info.className='muted';
  info.innerHTML = memories.length
    ? `当前记忆 <b>${memories.length}</b> 条。支持：标题、编辑、删除、单独导出、跳回来源。`
    : `当前 0 条记忆。请导入 memories.json，或确保 conversations.json 内含明确的结构化记忆字段（白名单）。`;
  view.appendChild(info);

  const searchWrap=document.createElement('div');
  searchWrap.className='row';
  searchWrap.innerHTML = `
    <span class="badge">搜索</span>
    <input type="text" id="memQ" placeholder="输入关键字…" style="width:14rem">
    <button class="btn" id="memClear">清空</button>
  `;
  view.appendChild(searchWrap);

  const qInput = searchWrap.querySelector('#memQ');
  const clearBtn = searchWrap.querySelector('#memClear');

  const list=document.createElement('div');
  list.style.display='flex';
  list.style.flexDirection='column';
  list.style.gap='.55rem';
  view.appendChild(list);

  function draw(query=''){
    list.innerHTML='';
    const q = query.trim().toLowerCase();
    const arr = q ? memories.filter(m=>{
      return (m.title||'').toLowerCase().includes(q) || (m.text||'').toLowerCase().includes(q);
    }) : memories;

    if(!memories.length){
      list.innerHTML = `<div class="muted">（暂无记忆数据）</div>`;
      return;
    }
    if(q && !arr.length){
      list.innerHTML = `<div class="muted">没有匹配结果。</div>`;
      return;
    }

    arr.forEach(m=>{
      const card=document.createElement('div');
      card.className='card';

      const top=document.createElement('div');
      top.className='meta';
      const ts = (m.created && typeof m.created==='number' && m.created>1000000000)
        ? new Date(m.created*1000).toLocaleString()
        : '';
      const src = m.source || 'memory';
      const hasFrom = !!m.from;
      top.innerHTML = `
        <span class="chip">来源：${escapeHTML(src)}</span>
        ${ts?`<span>${escapeHTML(ts)}</span>`:''}
        <span>字数：${(m.text||'').length}</span>
        ${hasFrom?`<button class="btn" style="padding:.18rem .52rem" data-jump="1">跳回</button>`:''}
      `;
      card.appendChild(top);

      const h=document.createElement('div');
      h.style.fontWeight='800';
      h.style.margin='.1rem 0 .35rem 0';
      h.textContent = m.title || '未命名';
      card.appendChild(h);

      const line=document.createElement('div');
      line.className='mem-line';
      line.textContent = m.text || '';
      card.appendChild(line);

      const actions=document.createElement('div');
      actions.className='mem-actions';
      actions.innerHTML = `
        <button class="btn" data-copy="1">复制</button>
        <button class="btn" data-edit="1">编辑</button>
        <button class="btn" data-del="1">删除</button>
        <button class="btn" data-exp="1">导出</button>
      `;
      card.appendChild(actions);

      const btnCopy = actions.querySelector('[data-copy]');
      const btnEdit = actions.querySelector('[data-edit]');
      const btnDel  = actions.querySelector('[data-del]');
      const btnExp  = actions.querySelector('[data-exp]');
      const btnJump = top.querySelector('[data-jump]');

      btnCopy.onclick = ()=> { lastTouchedMemId = m.id; copyText(m.text||''); };
      btnEdit.onclick = ()=> { lastTouchedMemId = m.id; openMemEditor({mode:'edit', memId:m.id}); };
      btnDel.onclick  = ()=> { lastTouchedMemId = m.id; confirmDeleteMemory(m.id); };
      btnExp.onclick  = ()=> { lastTouchedMemId = m.id; exportMemory(m.id, expFmt.value || 'txt'); };
      if(btnJump){
        btnJump.onclick = ()=> { lastTouchedMemId = m.id; jumpToMemorySource(m.id); };
      }

      list.appendChild(card);
    });
  }

  qInput.oninput = ()=> draw(qInput.value);
  clearBtn.onclick = ()=>{ qInput.value=''; draw(''); };
  draw('');
}

/* ===== 复制 ===== */
async function copyText(text){
  try{
    await navigator.clipboard.writeText(text||'');
    toast('已复制');
  }catch{
    try{
      const ta=document.createElement('textarea');
      ta.value=text||'';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      toast('已复制');
    }catch{
      toast('复制失败（浏览器限制）');
    }
  }
}

/* ===== 长按（不抢选词） ===== */
function attachLongPress(el, onLong){
  let timer=null;
  let moved=false;
  const threshold=520;

  const clear=()=>{ if(timer){clearTimeout(timer);timer=null;} };

  el.addEventListener('touchstart', ()=>{
    moved=false;
    clear();
    timer=setTimeout(()=>{
      if(!moved) onLong();
    }, threshold);
  }, {passive:true});

  el.addEventListener('touchmove', ()=>{ moved=true; clear(); }, {passive:true});
  el.addEventListener('touchend', clear, {passive:true});
  el.addEventListener('touchcancel', clear, {passive:true});

  el.addEventListener('mousedown', (e)=>{
    if(e.button!==0) return;
    moved=false;
    clear();
    timer=setTimeout(()=>{ if(!moved) onLong(); }, threshold);
  });
  el.addEventListener('mousemove', ()=>{ moved=true; clear(); });
  el.addEventListener('mouseup', clear);
  el.addEventListener('mouseleave', clear);
}

/* ===== 选中文字 -> 浮层“加入记忆” ===== */
const selFloat = document.getElementById('selFloat');
const btnSelToMem = document.getElementById('btnSelToMem');

let lastSelectionText = '';
let lastSelectionFrom = null; // {convId,convTitle,msgId,msgIndex}

function hideSelFloat(){ selFloat.classList.remove('show'); }
function showSelFloatAt(x,y){
  const w = 110;
  selFloat.style.left = `${Math.max(10, Math.min(window.innerWidth-w-10, x - w/2))}px`;
  selFloat.style.top  = `${Math.max(10, y - 52)}px`;
  selFloat.classList.add('show');
}

document.addEventListener('selectionchange', ()=>{
  const sel = window.getSelection();
  const text = sel ? String(sel).trim() : '';
  if(!text){
    lastSelectionText='';
    lastSelectionFrom=null;
    hideSelFloat();
    return;
  }
  // 只在聊天/编辑页起作用
  if(viewMode !== 'chats' && viewMode !== 'edit'){ hideSelFloat(); return; }

  const range = sel.rangeCount ? sel.getRangeAt(0) : null;
  if(!range){ hideSelFloat(); return; }

  const node = range.commonAncestorContainer.nodeType===1 ? range.commonAncestorContainer : range.commonAncestorContainer.parentElement;
  if(!node){ hideSelFloat(); return; }

  const bubble = node.closest('.msg');
  if(!bubble){ hideSelFloat(); return; }

  const convId = bubble.dataset.convId;
  const msgId  = bubble.dataset.msgId;
  const msgIndex = Number(bubble.dataset.msgIndex||0);
  const conv = conversations.find(x=>x.id===convId);
  if(!conv){ hideSelFloat(); return; }

  const rect = range.getBoundingClientRect();
  if(!rect || (rect.width===0 && rect.height===0)){
    hideSelFloat(); return;
  }

  lastSelectionText = text;
  lastSelectionFrom = {
    convId,
    convTitle: conv.title||'',
    msgId,
    msgIndex
  };

  showSelFloatAt(rect.left + rect.width/2, rect.top + window.scrollY);
});

btnSelToMem.onclick = ()=>{
  if(!lastSelectionText.trim()){
    toast('未选中内容');
    return;
  }
  openMemEditor({
    mode:'new',
    presetText:lastSelectionText,
    presetFrom:lastSelectionFrom
  });
  hideSelFloat();
};

/* ===== Sheet（编辑消息 / 新增记忆 / 编辑记忆） ===== */
const sheetBackdrop = document.getElementById('sheetBackdrop');
const sheet = document.getElementById('sheet');
const sheetTitle = document.getElementById('sheetTitle');
const sheetText = document.getElementById('sheetText');
const sheetMeta = document.getElementById('sheetMeta');
const sheetClose = document.getElementById('sheetClose');
const sheetCancel = document.getElementById('sheetCancel');
const sheetDone = document.getElementById('sheetDone');

let sheetMode = null; // 'mem-new'|'mem-edit'|'msg-edit'
let sheetPayload = null;

function openSheet({title, text, meta, mode, payload}){
  sheetMode = mode;
  sheetPayload = payload || null;
  sheetTitle.textContent = title || '编辑';
  sheetText.value = text || '';
  sheetMeta.textContent = meta || '';
  sheetBackdrop.classList.add('show');
  sheet.classList.add('show');
}
function closeSheet(){
  sheetBackdrop.classList.remove('show');
  sheet.classList.remove('show');
  sheetMode=null;
  sheetPayload=null;
}
sheetClose.onclick = closeSheet;
sheetCancel.onclick = closeSheet;

function openMemEditor({mode, memId, presetText, presetFrom}){
  if(mode==='new'){
    const text = presetText || '';
    const meta = presetFrom ? `来源：${presetFrom.convTitle||''}｜第 ${presetFrom.msgIndex+1} 条` : '';
    openSheet({
      title: '新增记忆（可编辑标题）',
      text: text,
      meta: meta + (meta? '｜':'' ) + '完成后可在记忆页编辑标题与导出',
      mode: 'mem-new',
      payload: {from: presetFrom || null}
    });
    return;
  }
  if(mode==='edit'){
    const mem = memories.find(x=>x.id===memId);
    if(!mem){ toast('记忆不存在'); return; }
    const meta = `${mem.source||''}${mem.from?`｜来源：${mem.from.convTitle||''}｜第 ${mem.from.msgIndex+1} 条`:''}`;
    openSheet({
      title: '编辑记忆（第一行=标题，空行后为正文）',
      text: `${mem.title||''}\n\n${mem.text||''}`,
      meta: meta,
      mode: 'mem-edit',
      payload: {memId}
    });
  }
}

function confirmDeleteMemory(memId){
  const mem = memories.find(x=>x.id===memId);
  if(!mem) return;
  const ok = confirm(`是否删除该记忆？\n\n${mem.title||'未命名'}`);
  if(!ok) return;
  memories = memories.filter(x=>x.id!==memId);
  updateMemMeta();
  if(viewMode==='mems') renderMems();
  toast('已删除');
}

function exportMemory(memId, fmt){
  const mem = memories.find(x=>x.id===memId);
  if(!mem){ toast('记忆不存在'); return; }
  const title = mem.title || 'memory';

  if(fmt==='json'){
    const payload = {
      id: mem.id,
      title: mem.title,
      text: mem.text,
      created: mem.created,
      source: mem.source,
      from: mem.from || null
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json;charset=utf-8'});
    downloadBlob(blob, `memory_${safeName(title)}.json`);
    return;
  }

  if(fmt==='html'){
    const html = `<!doctype html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>${escapeHTML(title)}</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#f2f2f7;color:#111}
.wrap{max-width:900px;margin:0 auto;padding:1rem .9rem}
h2{margin:.2rem 0 .7rem 0}
.meta{color:rgba(60,60,67,.60);font-size:.85rem;margin:.2rem 0 .8rem 0}
pre{white-space:pre-wrap;line-height:1.6;background:#fff;border:1px solid rgba(60,60,67,.18);border-radius:14px;padding:.8rem}
</style></head><body><div class="wrap">
<h2>${escapeHTML(title)}</h2>
<div class="meta">来源：${escapeHTML(mem.source||'')} ${mem.from?`｜${escapeHTML(mem.from.convTitle||'')}｜第 ${mem.from.msgIndex+1} 条`:''}</div>
<pre>${escapeHTML(mem.text||'')}</pre>
</div></body></html>`;
    const blob = new Blob([html], {type:'text/html;charset=utf-8'});
    downloadBlob(blob, `memory_${safeName(title)}.html`);
    return;
  }

  // txt
  const lines = [];
  lines.push(`# ${mem.title||'未命名'}`);
  lines.push(`来源：${mem.source||''}${mem.from?`｜${mem.from.convTitle||''}｜第 ${mem.from.msgIndex+1} 条`:''}`);
  if(mem.created && mem.created>1000000000){
    lines.push(`时间：${new Date(mem.created*1000).toLocaleString()}`);
  }
  lines.push('');
  lines.push(mem.text||'');
  const blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
  downloadBlob(blob, `memory_${safeName(title)}.txt`);
}

function exportAllMemories(fmt){
  if(memories.length===0){ toast('没有记忆可导出'); return; }

  if(fmt==='json'){
    const payload = memories.map(m=>({
      id:m.id, title:m.title, text:m.text, created:m.created, source:m.source, from:m.from||null
    }));

    downloadBlob(blob, `memories_all.json`);

.wrap{max-width:980px;margin:0 auto;padding:1rem .9rem}
.card{background:#fff;border:1px solid rgba(60,60,67,.18);border-radius:14px;padding:.8rem;margin:.6rem 0}

    lines.push(m.text||'');
    lines.push('----------------------------------------');
  });
  const blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
  downloadBlob(blob, `memories_all.txt`);
  toast('已导出全部记忆');
}

function jumpToMemorySource(memId){
  const mem = memories.find(x=>x.id===memId);
  if(!mem || !mem.from){ toast('该记忆没有来源定位'); return; }
  const {convId, msgIndex} = mem.from;
  const idx = conversations.findIndex(c=>c.id===convId);
  if(idx<0){ toast('找不到对应会话'); return; }

  currentConv = idx;
  selConv.value = String(idx);
  updateConvMeta();
  buildDrawerList();
  setMode('chats');

  setTimeout(()=>{
    const bubbles = document.querySelectorAll('.msg');
    const target = [...bubbles].find(b=>Number(b.dataset.msgIndex)===Number(msgIndex));
    if(target){
      target.scrollIntoView({behavior:'smooth', block:'center'});
      target.style.outline = '2px solid color-mix(in oklab, var(--user) 55%, transparent)';
      setTimeout(()=>target.style.outline='none', 900);
    }
  }, 80);
}

    return;
  }

  if(sheetMode==='mem-new'){
    const from = sheetPayload?.from || null;
    const raw = text.trim();
    if(!raw){
      toast('内容为空，未创建');
      closeSheet();
      return;
    }
    const mem = makeMem({
      title:'',
      text: raw,
      created: Math.floor(Date.now()/1000),
      source: from ? 'manual.selection' : 'manual.new',
      from: from
    });
    const ok = addMemory(mem, {silent:false});
    closeSheet();
    if(ok && viewMode==='mems') renderMems();
    return;
  }

  if(sheetMode==='mem-edit'){
    const memId = sheetPayload?.memId;
    const mem = memories.find(x=>x.id===memId);
    if(!mem){ toast('记忆不存在'); closeSheet(); return; }

    const all = text.replace(/\r\n/g,'\n');
    const parts = all.split('\n');
    const t = (parts.shift()||'').trim();
    while(parts.length && parts[0].trim()==='') parts.shift();
    const body = parts.join('\n').trim();

    if(!body){
      toast('正文为空，未保存');
      return;
    }
    const dup = memories.some(x=>x.id!==mem.id && (x.text||'').trim()===body);
    if(dup){
      toast('记忆重复，已忽略');
      return;
    }
    mem.title = t || (body.replace(/\s+/g,' ').slice(0,24) || '未命名');
    mem.text = body;
    lastTouchedMemId = mem.id;
    closeSheet();
    if(viewMode==='mems') renderMems();
    toast('已更新记忆');
    return;
  }

  closeSheet();
};

/* Sheet 控制 */
function closeSheet(){
  sheetBackdrop.classList.remove('show');
  sheet.classList.remove('show');
  sheetMode=null;
  sheetPayload=null;
}
document.getElementById('sheetClose').onclick = closeSheet;
document.getElementById('sheetCancel').onclick = closeSheet;
sheetBackdrop.onclick = closeSheet;

/* openSheet */
function openSheet({title, text, meta, mode, payload}){
  sheetMode = mode;
  sheetPayload = payload || null;
  sheetTitle.textContent = title || '编辑';
  sheetText.value = text || '';
  sheetMeta.textContent = meta || '';
  sheetBackdrop.classList.add('show');
  sheet.classList.add('show');
}

/* ===== 导出当前页面（你在看哪个就导哪个） ===== */
function exportCurrentPage(fmt){
  if(viewMode==='mems'){
    if(memories.length===0){ toast('没有记忆可导出'); return; }
    if(lastTouchedMemId){
      exportMemory(lastTouchedMemId, fmt);
    }else{
      exportAllMemories(fmt);
    }
    return;
  }

  const c = getConv();
  if(!c){ toast('没有可导出的会话'); return; }
  const useEdited = (viewMode==='edit');
  exportConversation(c, fmt, {useEdited});
}

function exportConversation(c, fmt, {useEdited}={}){
  const roleLabel = (r)=>{
    const n=prefs.names||{};
    if(r==='user') return n.user || 'User';
    if(r==='assistant') return n.assistant || 'Assistant';
    if(r==='system') return n.system || 'System';
    return r;
  };

  if(fmt==='json'){
    const payload = {
      title: c.title || '',
      created: c.created || 0,
      exported_view: useEdited ? 'edit' : 'chat',
      messages: c.messages.map(m=>({
        id: m.id,
        role: m.role,
        ts: m.ts||0,
        model: m.model||'',
        content: useEdited ? getRenderedText(c.id, m) : (m.content||''),
        branches: (m.branches||[]).map(thread=>thread.map(b=>({
          role:b.role, ts:b.ts||0, model:b.model||'', content:b.content||''
        })))
      }))
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json;charset=utf-8'});
    downloadBlob(blob, `${safeName(c.title)}${useEdited?'_edited':''}.json`);
    return;
  }

  if(fmt==='html'){
    const rootStyle = getComputedStyle(document.documentElement);
    const cssVars = ['--user','--system','--bubble-max']
      .map(v=>`${v}:${rootStyle.getPropertyValue(v).trim()}`).join(';');

    const metaLine = (role, ts, model, text)=>{
      const side = role==='user'?'align-right':role==='assistant'?'align-left':'align-center';
      return `<div class="meta ${side}">
        ${ts?`<span>${escapeHTML(ts)}</span>`:''}
        ${model?`<span class="chip">${escapeHTML(model)}</span>`:''}
        <span>字数：${(text||'').length}</span>
      </div>`;
    };

    const bubble = (role, text)=>{
      const cls = role==='user'?'user':(role==='system'?'system':'assistant');
      return `<div class="msg ${cls}">${escapeHTML(text||'')}</div>`;
    };

    let body = '';
    c.messages.forEach((m)=>{
      const ts = m.ts ? new Date(m.ts*1000).toLocaleString() : '';
      const content = useEdited ? getRenderedText(c.id, m) : (m.content||'');
      body += metaLine(m.role, ts, m.model||'', content);
      body += bubble(m.role, content);

      if(m.role==='assistant' && Array.isArray(m.branches) && m.branches.length){
        body += `<details class="branch"><summary>回溯分支（共 ${m.branches.length} 条，点展开）</summary><div class="branch-inner">`;
        m.branches.forEach((thread,i)=>{
          body += `<div class="chip">分支 ${i+1}/${m.branches.length}</div>`;
          thread.forEach(b=>{
            const ts2 = b.ts ? new Date(b.ts*1000).toLocaleString() : '';
            body += metaLine(b.role, ts2, b.model||'', b.content||'');
            body += bubble(b.role, b.content||'');
          });
          body += `<div style="height:.6rem"></div>`;
        });
        body += `</div></details>`;
      }
      body += `<div style="height:.35rem;border-top:1px solid rgba(60,60,67,.12);margin:.55rem 0"></div>`;
    });

    const html = `<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>${escapeHTML(c.title||'导出')}</title>
<style>
:root{${cssVars};--corner:18px}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#f2f2f7;color:#111}
.container{max-width:980px;margin:0 auto;padding:1rem .75rem 1.2rem .75rem;display:flex;flex-direction:column}
.meta{font-size:.72rem;color:rgba(60,60,67,.60);display:flex;gap:.45rem;flex-wrap:wrap;margin:.05rem .18rem}
.align-right{margin-left:auto;text-align:right}
.align-left{margin-right:auto;text-align:left}
.align-center{margin-left:auto;margin-right:auto;text-align:center}
.chip{padding:.08rem .4rem;border-radius:999px;background:rgba(0,0,0,.06);border:1px solid rgba(60,60,67,.18)}
.msg{max-width:var(--bubble-max);border-radius:var(--corner);padding:.55rem .72rem;line-height:1.55;white-space:pre-wrap;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.msg.user{background:var(--user);color:#fff;margin-left:auto}
.msg.assistant{background:#fff;color:#111;margin-right:auto}
.msg.system{background:rgba(175,82,222,.18);border:1px solid rgba(175,82,222,.22);margin-left:auto;margin-right:auto}
details.branch{margin:.35rem 0;border:1px solid rgba(60,60,67,.18);border-radius:12px;padding:.4rem .55rem;background:rgba(255,255,255,.7)}
details.branch summary{cursor:pointer;font-weight:750}
.branch-inner{margin-top:.35rem;display:flex;flex-direction:column;gap:.2rem}
</style></head><body>
<div class="container">
  <h2 style="margin:.2rem 0 .6rem 0">${escapeHTML(c.title||'(无标题)')}${useEdited?'（编辑稿）':''}</h2>
  ${body}
</div>
</body></html>`;

    const blob = new Blob([html], {type:'text/html;charset=utf-8'});
    downloadBlob(blob, `${safeName(c.title)}${useEdited?'_edited':''}.html`);
    return;
  }

  // txt
  const lines=[];
  lines.push(`# ${c.title || '(无标题)'}${useEdited?'（编辑稿）':''}\n`);
  lines.push(`创建：${c.created?new Date(c.created*1000).toLocaleString():'—'}`);
  lines.push(`消息数：${c.messages.length}  字数：${c.totalChars||0}`);
  lines.push('');
  lines.push('----------------------------------------');

  c.messages.forEach((m,idx)=>{
    const ts = m.ts?new Date(m.ts*1000).toLocaleString():'';
    const model = m.model?`[${m.model}]`:'';
    const content = useEdited ? getRenderedText(c.id, m) : (m.content||'');
    lines.push(`(${idx+1}) ${roleLabel(m.role)} ${model} ${ts}`.trim());
    lines.push(content||'');
    lines.push('');

    if(m.role==='assistant' && Array.isArray(m.branches) && m.branches.length){
      lines.push(`  [回溯分支 ${m.branches.length} 条]`);
      m.branches.forEach((thread,i)=>{
        lines.push(`  - 分支 ${i+1}/${m.branches.length}`);
        thread.forEach(b=>{
          const ts2=b.ts?new Date(b.ts*1000).toLocaleString():'';
          const model2=b.model?`[${b.model}]`:'';
          lines.push(`    ${roleLabel(b.role)} ${model2} ${ts2}`.trim());
          lines.push(`    ${String(b.content||'').replace(/\n/g,"\n    ")}`);
        });
        lines.push('');
      });
      lines.push('----------------------------------------');
    }else{
      lines.push('----------------------------------------');
    }
  });

  const blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
  downloadBlob(blob, `${safeName(c.title)}${useEdited?'_edited':''}.txt`);
}

/* ===== 初始化 ===== */
(function init(){
  const isDark = !!prefs.dark;
  document.body.classList.toggle('dark', isDark);
  btnTheme.textContent = isDark ? '日间' : '夜间';

  if(prefs.colors?.user) setCSS('--user', prefs.colors.user);
  if(prefs.colors?.system) setCSS('--system', prefs.colors.system);
  cUser.value = prefs.colors?.user || '#0a84ff';
  cSys.value  = prefs.colors?.system || '#af52de';

  const bw = prefs.bubble || 86;
  rngBubble.value = bw;
  setCSS('--bubble-max', `${bw}%`);
  txtBubble.textContent = `${bw}%`;

  nmUser.value = prefs.names?.user || '';
  nmAsst.value = prefs.names?.assistant || '';
  nmSys.value  = prefs.names?.system || '';

  setPanelTab('export');
  setMode('chats');

  layoutTick();
  setTimeout(layoutTick, 120);
})();

/* panel tabs */
function setPanelTab(tab){
  panelTab = tab;
  pillExport.classList.toggle('active', tab==='export');
  pillSettings.classList.toggle('active', tab==='settings');
  panelExport.style.display = tab==='export' ? 'block' : 'none';
  panelSettings.style.display = tab==='settings' ? 'block' : 'none';
}

/* drawer close */
document.getElementById('btnCloseDrawer').onclick = ()=> openDrawer(false);

/* conv select change */
selConv.onchange = ()=>{
  currentConv = Number(selConv.value)||0;
  updateConvMeta();
  buildDrawerList();
  renderCurrent();
  main.scrollTop=0;
};

/* 导入按钮 */
document.getElementById('btnImport').onclick = ()=> fileInput.click();
