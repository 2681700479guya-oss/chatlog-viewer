<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>chat聊天记录查看器</title>

<style>
/* =========================
   Core Variables
========================= */
:root{
  --bg-light:#f2f2f7;       /* iOS system gray */
  --bg-dark:#000000;
  --text-light:#111111;
  --text-dark:#ffffff;

  --card-light:#ffffff;
  --card-dark:#1c1c1e;

  --sep-light: rgba(60,60,67,.18);
  --sep-dark:  rgba(84,84,88,.35);

  --muted-light: rgba(60,60,67,.60);
  --muted-dark:  rgba(235,235,245,.60);

  --user:#0a84ff;           /* iOS blue */
  --assistant:#1c1c1e;      /* used as accent in branch border */
  --sys:#af52de;

  --chip-light: rgba(0,0,0,.06);
  --chip-dark:  rgba(255,255,255,.10);

  --bubble-assist-light:#ffffff;
  --bubble-assist-dark:#1c1c1e;

  --bubble-max:86%;

  --header-h:48px;          /* runtime override */
  --panel-cur:0px;          /* runtime override */
  --sidebar-top:0px;        /* runtime override */
  --vh:1vh;                 /* runtime override */
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg-light);
  color:var(--text-light);
  -webkit-tap-highlight-color:transparent;
  height: calc(var(--vh, 1vh) * 100);
  overflow:hidden;                 /* lock body; only inner scroll */
  overscroll-behavior:none;
}
body.dark{
  background:var(--bg-dark);
  color:var(--text-dark);
}

/* =========================
   Top Nav (iOS-like)
========================= */
header{
  position:sticky;top:0;z-index:70;
  backdrop-filter:saturate(180%) blur(12px);
  background:color-mix(in oklab, #fff 88%, transparent);
  border-bottom:1px solid var(--sep-light);
  display:flex;align-items:center;justify-content:space-between;
  gap:.5rem;
  padding:.28rem .65rem;
}
body.dark header{
  background:color-mix(in oklab, #1c1c1e 88%, transparent);
  border-bottom-color:var(--sep-dark);
}
h1{
  margin:0;
  font-size:.92rem;
  font-weight:600;
  letter-spacing:.2px;
  display:flex;align-items:center;gap:.45rem;
  transition:opacity .2s, transform .2s;
}
.icon-btn{
  border:none;
  background:transparent;
  padding:.2rem .35rem;
  font-size:1.05rem;
  cursor:pointer;
  color:inherit;
}
.controls{
  display:flex;align-items:center;gap:.35rem;flex-wrap:nowrap;white-space:nowrap;
}
button,select,input[type="range"],input[type="text"]{
  font-size:.85rem;
  padding:.34rem .55rem;
  border-radius:999px;
  border:1px solid var(--sep-light);
  background:color-mix(in oklab, #fff 92%, transparent);
  color:inherit;
}
body.dark button,body.dark select,body.dark input[type="range"],body.dark input[type="text"]{
  border-color:var(--sep-dark);
  background:color-mix(in oklab, #2c2c2e 90%, transparent);
}
button:active{transform:scale(.98)}
input[type=file]{display:none}

/* =========================
   Fixed Console Panel
========================= */
.panel-fixed{
  position:fixed;left:0;right:0;top:var(--header-h);
  z-index:60;
  display:none;
}
.panel-fixed.open{display:block}
.panel{
  border-bottom:1px solid var(--sep-light);
  background:color-mix(in oklab, #fff 92%, transparent);
  backdrop-filter:saturate(180%) blur(10px);
}
body.dark .panel{
  border-bottom-color:var(--sep-dark);
  background:color-mix(in oklab, #1c1c1e 92%, transparent);
}
.panel-content{padding:.6rem .8rem}
.group{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:.2rem 0}
.badge{
  padding:.15rem .45rem;
  border-radius:999px;
  border:1px solid var(--sep-light);
  background:color-mix(in oklab, #fff 88%, transparent);
  font-size:.76rem;
  font-weight:500;
}
body.dark .badge{
  border-color:var(--sep-dark);
  background:color-mix(in oklab, #2c2c2e 88%, transparent);
}
.colorbox{display:flex;gap:.45rem;align-items:center}
.colorbox label{font-size:.8rem;opacity:.85}
.colorbox input[type=color]{width:30px;height:26px;padding:0;border:none;background:transparent;cursor:pointer}
.panel-spacer{height:0}

/* =========================
   Layout + Sidebar Drawer
========================= */
.layout{display:flex}
.sidebar{
  position:fixed;left:0;top:var(--sidebar-top);
  width:280px;
  height:calc((var(--vh,1vh)*100) - var(--sidebar-top));
  background:var(--card-light);
  border-right:1px solid var(--sep-light);
  box-shadow:8px 0 24px rgba(0,0,0,.12);
  transform:translateX(-100%);
  transition:transform .25s ease;
  z-index:55;
  display:flex;flex-direction:column;
}
body.dark .sidebar{
  background:var(--card-dark);
  border-right-color:var(--sep-dark);
  box-shadow:8px 0 24px rgba(0,0,0,.45);
}
.sidebar.open{transform:translateX(0)}
.sidebar .side-head{
  padding:.7rem .8rem;
  border-bottom:1px solid var(--sep-light);
}
body.dark .sidebar .side-head{border-bottom-color:var(--sep-dark)}
.sidebar .list{overflow:auto;padding:.45rem;-webkit-overflow-scrolling:touch}
.conv-item{
  padding:.55rem .65rem;
  border-radius:12px;
  margin:.25rem 0;
  cursor:pointer;
  border:1px solid transparent;
}
.conv-item:hover{background:color-mix(in oklab,currentColor 6%,transparent)}
.conv-item.active{
  background:color-mix(in oklab, var(--user) 10%, transparent);
  border-color:color-mix(in oklab, var(--user) 30%, transparent);
}
.meta-mini{font-size:.74rem;color:var(--muted-light);margin-top:.18rem}
body.dark .meta-mini{color:var(--muted-dark)}

.backdrop{
  position:fixed;inset:0;z-index:50;
  background:rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:.2s;
}
.backdrop.show{opacity:1;pointer-events:auto}

/* =========================
   Main Chat (only scroll area)
========================= */
main.container{
  width:100%;
  max-width:960px;
  margin:0 auto;
  padding:.75rem .65rem 1.2rem .65rem;
  height:calc((var(--vh,1vh)*100) - var(--header-h) - var(--panel-cur));
  overflow:auto;
  overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
  scrollbar-gutter:stable both-edges;
}
@media (min-width:1100px){
  .sidebar{transform:translateX(0)}
  .backdrop{display:none}
  main.container{margin-left:280px;max-width:980px}
}

.chat{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:.62rem;
  overflow-anchor:none;
}

/* info lines */
.name, .meta-top{
  font-size:.72rem;
  color:var(--muted-light);
}
body.dark .name, body.dark .meta-top{color:var(--muted-dark)}
.name{margin:0 .18rem .18rem .18rem}
.meta-top{margin:.05rem .18rem;display:flex;gap:.45rem;flex-wrap:wrap}

.model-chip{
  padding:.08rem .4rem;border-radius:999px;
  background:var(--chip-light);
  border:1px solid var(--sep-light);
}
body.dark .model-chip{
  background:var(--chip-dark);
  border-color:var(--sep-dark);
}

/* alignment helpers */
.align-right{margin-left:auto;text-align:right}
.align-left{margin-right:auto;text-align:left}
.align-center{margin-left:auto;margin-right:auto;text-align:center}

/* bubbles (fixed sides via auto margins) */
.msg{
  max-width:var(--bubble-max);
  border-radius:18px;
  padding:.55rem .72rem;
  line-height:1.55;
  white-space:pre-wrap;
  box-shadow:0 1px 0 rgba(0,0,0,.03);
}
.msg.user{
  background:var(--user);
  color:#fff;
  margin-left:auto;
  box-shadow:0 1px 0 rgba(10,132,255,.25);
}
.msg.assistant{
  background:var(--bubble-assist-light);
  color:#111;
  margin-right:auto;
  box-shadow:0 1px 0 rgba(0,0,0,.04);
}
body.dark .msg.assistant{
  background:var(--bubble-assist-dark);
  color:#fff;
  box-shadow:0 1px 0 rgba(0,0,0,.28);
}
.msg.system{
  margin-left:auto;margin-right:auto;
  background:color-mix(in oklab, var(--sys) 22%, transparent);
  color:color-mix(in oklab, #111 60%, var(--sys) 40%);
  border:1px solid color-mix(in oklab, var(--sys) 28%, transparent);
  box-shadow:none;
}
body.dark .msg.system{
  color:color-mix(in oklab, #fff 70%, var(--sys) 30%);
  border-color:color-mix(in oklab, var(--sys) 30%, transparent);
}

/* =========================
   Branch (回溯) - default collapsed
========================= */
details.branch{
  border-left:4px solid color-mix(in oklab, var(--user) 70%, #8e8e93 30%);
  background:color-mix(in oklab, #fff 70%, transparent);
  box-shadow:inset 0 0 0 1px color-mix(in oklab, #000 7%, transparent);
  border-radius:12px;
  padding:.35rem .55rem;
  margin:.35rem 0 .15rem 0;
}
body.dark details.branch{
  background:color-mix(in oklab, #1c1c1e 70%, transparent);
  box-shadow:inset 0 0 0 1px color-mix(in oklab, #fff 10%, transparent);
}
.branch summary{
  cursor:pointer;
  list-style:none;
  display:flex;align-items:center;gap:.5rem;
  padding:.2rem 0;
  font-size:.78rem;
  font-weight:600;
  user-select:none;
}
.branch summary::-webkit-details-marker{display:none}
.branch .branch-badge{
  font-size:.72rem;
  padding:.1rem .45rem;
  border-radius:999px;
  background:var(--chip-light);
  border:1px solid var(--sep-light);
}
body.dark .branch .branch-badge{
  background:var(--chip-dark);
  border-color:var(--sep-dark);
}
.branch-thread{
  display:flex;
  flex-direction:column;
  gap:.55rem;
  margin:.45rem .1rem .55rem .25rem;
}
.branch .msg{max-width:calc(var(--bubble-max) - 6%)}

/* =========================
   Modal (Batch export)
========================= */
.modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal .mask{position:absolute;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(2px)}
.modal .card{
  position:relative;z-index:1;
  max-width:92vw;width:680px;max-height:82vh;overflow:auto;
  background:var(--card-light);
  border:1px solid var(--sep-light);
  border-radius:14px;
  padding:.8rem;
}
body.dark .modal .card{background:var(--card-dark);border-color:var(--sep-dark)}
.modal .title{font-weight:700;margin-bottom:.55rem}
.modal .list{display:flex;flex-direction:column;gap:.35rem}
.modal .row{
  display:flex;align-items:center;gap:.55rem;
  border:1px solid var(--sep-light);
  border-radius:12px;
  padding:.5rem .55rem;
}
body.dark .modal .row{border-color:var(--sep-dark)}
.modal .foot{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.75rem;flex-wrap:wrap}

/* =========================
   Error Bar
========================= */
.errbar{
  position:fixed;left:0;right:0;bottom:0;z-index:95;
  background:#c0392b;color:#fff;
  padding:.55rem .85rem;display:none;
}
.errbar.show{display:block}
</style>
</head>

<body>
<header id="siteHeader">
  <h1 id="navTitle">
    <button id="burger" class="icon-btn" aria-label="菜单">☰</button>
    ChatGPT 聊天记录查看器
  </h1>
  <div class="controls">
    <input id="file" type="file" accept=".json" />
    <button onclick="pickFile()">导入</button>
    <button onclick="exportCurrentConversation()">导出当前</button>
    <button onclick="openBatchModal()">批量导出</button>
    <button id="togglePanelBtn">展开控制台</button>
    <button onclick="toggleTheme()">夜间/日间</button>
  </div>
</header>

<!-- Fixed Console -->
<div class="panel-fixed" id="panelWrap">
  <div class="panel">
    <div class="panel-content">
      <div class="group">
        <span class="badge">会话</span>
        <select id="convListTop" onchange="selectConversation(this.value)"></select>
        <span class="badge" id="convMeta" title="创建时间 / 消息数 / 字数"></span>
      </div>

      <div class="group">
        <span class="badge">外观</span>
        <div class="colorbox">
          <label>用户</label><input type="color" id="cUser">
          <label>助手</label><input type="color" id="cAssistant">
          <label>系统</label><input type="color" id="cSystem">
        </div>
        <span class="badge">气泡宽度</span>
        <input type="range" id="bubbleWidth" min="60" max="100" value="86" oninput="setBubbleWidth(this.value)">
        <span id="bubbleVal" class="badge" style="opacity:.7">86%</span>
        <button onclick="resetTheme()">恢复默认</button>
      </div>

      <div class="group">
        <span class="badge">显示名</span>
        <input id="nameUser" type="text" placeholder="用户显示名" style="width:8.2rem">
        <input id="nameAssistant" type="text" placeholder="助手显示名" style="width:8.2rem">
        <input id="nameSystem" type="text" placeholder="系统显示名" style="width:8.2rem">
        <button onclick="saveNames()">保存</button>
      </div>
    </div>
  </div>
</div>
<div id="panelSpacer" class="panel-spacer"></div>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem">
        <strong>会话列表</strong>
        <button id="closeSidebar">关闭</button>
      </div>
      <div style="font-size:.78rem;color:var(--muted-light)">导入 conversations.json 或单会话 JSON</div>
    </div>
    <div class="list" id="convListSide"></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <!-- Main Chat -->
  <main class="container" id="mainScroll">
    <div id="chat" class="chat">
      <p style="color:var(--muted-light);text-align:center;margin-top:1rem">
        请选择 ChatGPT 官方导出解压后的 JSON（单个会话或 conversations.json）
      </p>
    </div>
  </main>
</div>

<!-- Batch Export Modal -->
<div class="modal" id="batchModal">
  <div class="mask" onclick="closeBatchModal()"></div>
  <div class="card">
    <div class="title">批量导出会话（多文件）</div>
    <div class="list" id="batchList"></div>
    <div class="foot">
      <button onclick="selectAllBatch(true)">全选</button>
      <button onclick="selectAllBatch(false)">全不选</button>
      <button onclick="doBatchExport()">导出选中</button>
      <button onclick="closeBatchModal()">关闭</button>
    </div>
  </div>
</div>

<div id="err" class="errbar"></div>

<script>
/* =========================
   Helpers
========================= */
const errBar = document.getElementById('err');
function showErr(msg){
  errBar.textContent = msg;
  errBar.classList.add('show');
  setTimeout(()=>errBar.classList.remove('show'), 6500);
}
function escapeHTML(s){
  return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function setCSS(name,val){ document.documentElement.style.setProperty(name,val); }

/* =========================
   Stable VH (anti-jitter)
========================= */
function setStableVH(){
  const vh = window.innerHeight * 0.01;
  setCSS('--vh', `${vh}px`);
}

/* =========================
   Prefs
========================= */
let dark = false;
const PREF_KEY = 'chatviewer_prefs_ios_v1';
const prefs = loadPrefs();

function loadPrefs(){
  try{ return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; }
  catch{ return {}; }
}
function savePrefs(){
  try{ localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); }
  catch(e){ showErr('保存偏好失败：' + e.message); }
}

/* =========================
   Theme / Appearance
========================= */
function toggleTheme(){
  try{
    dark = !dark;
    document.body.classList.toggle('dark', dark);
    prefs.dark = dark;
    savePrefs();
  }catch(e){ showErr('切换主题失败：'+e.message); }
}
function setBubbleWidth(val){
  setCSS('--bubble-max', `${val}%`);
  document.getElementById('bubbleVal').textContent = `${val}%`;
  prefs.bubble = Number(val);
  savePrefs();
}
function resetTheme(){
  try{
    setCSS('--user', '#0a84ff');
    setCSS('--assistant', '#1c1c1e');
    setCSS('--sys', '#af52de');
    document.getElementById('cUser').value = '#0a84ff';
    document.getElementById('cAssistant').value = '#1c1c1e';
    document.getElementById('cSystem').value = '#af52de';
    setBubbleWidth(86);
    prefs.colors = {user:'#0a84ff', assistant:'#1c1c1e', sys:'#af52de'};
    savePrefs();
    render();
    updateLayoutHeights();
  }catch(e){ showErr('恢复默认失败：'+e.message); }
}

/* color pickers */
document.getElementById('cUser').addEventListener('input',e=>{
  setCSS('--user', e.target.value);
  prefs.colors = prefs.colors || {};
  prefs.colors.user = e.target.value;
  savePrefs();
});
document.getElementById('cAssistant').addEventListener('input',e=>{
  setCSS('--assistant', e.target.value);
  prefs.colors = prefs.colors || {};
  prefs.colors.assistant = e.target.value;
  savePrefs();
});
document.getElementById('cSystem').addEventListener('input',e=>{
  setCSS('--sys', e.target.value);
  prefs.colors = prefs.colors || {};
  prefs.colors.sys = e.target.value;
  savePrefs();
});

/* display names */
function saveNames(){
  try{
    prefs.names = {
      user: document.getElementById('nameUser').value.trim(),
      assistant: document.getElementById('nameAssistant').value.trim(),
      system: document.getElementById('nameSystem').value.trim()
    };
    savePrefs();
    render();
  }catch(e){ showErr('保存显示名失败：'+e.message); }
}
function displayName(role){
  const n = prefs.names || {};
  if(role==='user') return n.user || '';
  if(role==='assistant') return n.assistant || '';
  if(role==='system') return n.system || '';
  return '';
}

/* =========================
   Console open/close (top bar)
========================= */
const siteHeader = document.getElementById('siteHeader');
const panelWrap = document.getElementById('panelWrap');
const panelSpacer = document.getElementById('panelSpacer');
const togglePanelBtn = document.getElementById('togglePanelBtn');

togglePanelBtn.addEventListener('click', ()=>{
  setPanelOpen(!panelWrap.classList.contains('open'));
});

function setPanelOpen(open){
  panelWrap.classList.toggle('open', open);
  togglePanelBtn.textContent = open ? '收起控制台' : '展开控制台';
  prefs.panelOpen = open;
  savePrefs();
  updateLayoutHeights();
}

/* Layout heights */
function updateLayoutHeights(){
  setStableVH();

  const headerH = siteHeader.offsetHeight || 48;
  setCSS('--header-h', headerH + 'px');

  const contentH = panelWrap.classList.contains('open')
    ? (panelWrap.querySelector('.panel')?.offsetHeight || 0)
    : 0;

  panelSpacer.style.height = contentH + 'px';
  setCSS('--panel-cur', contentH + 'px');

  const sidebarTop = headerH + contentH;
  setCSS('--sidebar-top', sidebarTop + 'px');

  // also set sidebar top inline for safety
  document.getElementById('sidebar').style.top = sidebarTop + 'px';
}

/* =========================
   Sidebar drawer
========================= */
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('backdrop');
document.getElementById('burger').addEventListener('click', ()=>openSidebar(true));
document.getElementById('closeSidebar').addEventListener('click', ()=>openSidebar(false));
backdrop.addEventListener('click', ()=>openSidebar(false));

function openSidebar(show){
  if(window.matchMedia('(min-width:1100px)').matches) return;
  sidebar.classList.toggle('open', show);
  backdrop.classList.toggle('show', show);
}

/* =========================
   File import
========================= */
function pickFile(){ document.getElementById('file').click(); }

document.getElementById('file').addEventListener('change', async(e)=>{
  const f = e.target.files?.[0];
  if(!f) return;
  try{
    const raw = await f.text();
    let data;
    try{ data = JSON.parse(raw); }
    catch{ throw new Error('不是有效 JSON：请导入 ChatGPT 官方导出解压后的 JSON'); }
    handleImportedJSON(data);
  }catch(err){ showErr(err.message || String(err)); }
});

/* =========================
   Data parsing + state
========================= */
let conversations = []; // {id,title,created,messages:[{role,content,model,ts,previous:[]}], totalChars}
let currentConvIndex = 0;

function handleImportedJSON(data){
  try{
    conversations = [];
    if(Array.isArray(data)){
      data.forEach(obj=>{ const c=parseConversation(obj); if(c) conversations.push(c); });
    }else if(data && typeof data === 'object'){
      if(data.items && Array.isArray(data.items)){
        data.items.forEach(obj=>{ const c=parseConversation(obj); if(c) conversations.push(c); });
      }else{
        const c=parseConversation(data); if(c) conversations.push(c);
      }
    }
    if(!conversations.length) throw new Error('没解析到会话。请选择 conversations.json 或 conversations/*.json');

    conversations.forEach(c=>{
      c.totalChars = c.messages.reduce((acc,m)=>acc + (m.content?m.content.length:0),0);
    });

    buildTopSelect();
    buildSidebarList();

    currentConvIndex = 0;
    document.getElementById('convListTop').value = '0';
    updateConvMeta();
    render();

    setPanelOpen(!!prefs.panelOpen);
    updateLayoutHeights();
  }catch(e){ showErr('导入失败：' + (e.message || e)); }
}

function parseConversation(obj){
  const title = obj.title || obj.gist || obj.name || '';
  const created = obj.create_time || obj.update_time || obj.created || 0;
  const mapping = obj.mapping;
  const current = obj.current_node;

  if(!mapping || !current){
    if(Array.isArray(obj.messages)){
      const msgs = obj.messages.map(normalizeLinearMessage).filter(Boolean);
      return {id:obj.id||crypto.randomUUID(), title, created, messages:msgs};
    }
    return null;
  }

  const pathIds=[];
  let nodeId=current;
  while(nodeId && mapping[nodeId]){
    pathIds.push(nodeId);
    nodeId = mapping[nodeId].parent || null;
  }
  pathIds.reverse();

  const messages=[];
  const pathSet=new Set(pathIds);
  pathIds.forEach(pid=>{
    const n=mapping[pid];
    const m=normalizeNodeMessage(n);
    if(m) messages.push(m);
  });

  const idToIndex=new Map();
  messages.forEach((m,i)=>idToIndex.set(m._nodeId,i));

  pathIds.forEach(pid=>{
    const node=mapping[pid];
    const children=Array.isArray(node.children)?node.children:[];
    const branchKids=children.filter(cid=>!pathSet.has(cid));
    if(!branchKids.length) return;
    const branchArr=[];
    branchKids.forEach(bid=>collectBranchObjects(mapping,bid,branchArr));
    const at=idToIndex.get(pid);
    if(typeof at==='number' && branchArr.length){
      messages[at].previous = branchArr.slice(0,300);
    }
  });

  const msgs=messages.filter(m=>m.content && m.content.trim().length);
  return {id:obj.id||crypto.randomUUID(), title, created, messages:msgs};
}

function normalizeLinearMessage(m){
  const role = m.role || (m.author?.role) || "assistant";
  const parts = Array.isArray(m.content?.parts) ? m.content.parts.join("\n") : (m.content?.text || m.content || "");
  const content = typeof parts === 'string' ? parts : JSON.stringify(parts);
  const model = m.model || m.metadata?.model_slug || m.metadata?.model || "";
  const ts = m.create_time || m.ts || 0;
  return {role,content,model,ts,previous:[]};
}

function normalizeNodeMessage(node){
  const msg=node.message;
  if(!msg || !msg.author) return null;
  const role=msg.author.role || "assistant";
  if(!["user","assistant","system"].includes(role)) return null;

  let text="";
  if(Array.isArray(msg.content?.parts)) text=msg.content.parts.join("\n");
  else if(typeof msg.content?.text==='string') text=msg.content.text;
  else if(typeof msg.content==='string') text=msg.content;

  const model = msg.metadata?.model_slug || msg.metadata?.model || msg.model_slug || msg.model || "";
  const ts = msg.create_time || node.create_time || 0;
  return {role,content:text||"",model,ts,previous:[],_nodeId:node.id};
}

function collectBranchObjects(mapping,startId,out){
  const stack=[startId];
  while(stack.length){
    const id=stack.pop();
    const n=mapping[id];
    if(!n) continue;
    const m=normalizeNodeMessage(n);
    if(m && m.content) out.push({role:m.role,content:m.content,ts:m.ts,model:m.model});
    const kids=Array.isArray(n.children)?n.children:[];
    for(let i=kids.length-1;i>=0;i--) stack.push(kids[i]);
  }
}

/* =========================
   UI: conversation lists
========================= */
function buildTopSelect(){
  const sel=document.getElementById('convListTop');
  sel.innerHTML='';
  conversations.forEach((c,idx)=>{
    const opt=document.createElement('option');
    opt.value=String(idx);
    opt.textContent=c.title || `(无标题) ${idx+1}`;
    sel.appendChild(opt);
  });
}

function buildSidebarList(){
  const list=document.getElementById('convListSide');
  list.innerHTML='';
  conversations.forEach((c,idx)=>{
    const item=document.createElement('div');
    item.className='conv-item' + (idx===currentConvIndex?' active':'');
    const dateStr = c.created ? new Date(c.created*1000).toLocaleDateString() : '';
    item.innerHTML = `
      <div>${escapeHTML(c.title||`(无标题) ${idx+1}`)}</div>
      <div class="meta-mini">消息 ${c.messages.length}${dateStr?` · ${dateStr}`:''} · 字数 ${c.totalChars||0}</div>
    `;
    item.onclick=()=>{
      currentConvIndex=idx;
      document.getElementById('convListTop').value=String(idx);
      updateConvMeta();
      activateSidebarItem(idx);
      openSidebar(false);
      render();
      updateLayoutHeights();
      // scroll to top of main for new conversation for nicer app feel
      document.getElementById('mainScroll').scrollTop = 0;
    };
    list.appendChild(item);
  });
}

function activateSidebarItem(idx){
  const list=document.getElementById('convListSide');
  [...list.children].forEach(el=>el.classList.remove('active'));
  if(list.children[idx]) list.children[idx].classList.add('active');
}

function selectConversation(idxStr){
  currentConvIndex = Number(idxStr) || 0;
  updateConvMeta();
  activateSidebarItem(currentConvIndex);
  render();
  updateLayoutHeights();
  document.getElementById('mainScroll').scrollTop = 0;
}

/* meta info */
function updateConvMeta(){
  const c=conversations[currentConvIndex];
  const meta=document.getElementById('convMeta');
  const created=c.created ? new Date(c.created*1000).toLocaleString() : '—';
  const total=c.messages.reduce((acc,m)=>acc+(m.content?m.content.length:0),0);
  c.totalChars = total;
  meta.textContent = `创建：${created}｜消息数：${c.messages.length}｜字数：${total}`;

  // sync sidebar item text
  const list=document.getElementById('convListSide');
  if(list.children[currentConvIndex]){
    const metaMini=list.children[currentConvIndex].querySelector('.meta-mini');
    if(metaMini){
      const dateStr=c.created?new Date(c.created*1000).toLocaleDateString():'';
      metaMini.textContent = `消息 ${c.messages.length}${dateStr?` · ${dateStr}`:''} · 字数 ${total}`;
    }
  }
}

/* =========================
   Render chat
========================= */
function clsByRole(role){
  if(role==='user') return 'user';
  if(role==='system') return 'system';
  return 'assistant';
}

function render(){
  try{
    const chat=document.getElementById('chat');
    chat.innerHTML='';
    const c=conversations[currentConvIndex];
    if(!c){ chat.textContent='无会话'; return; }

    const arr=c.messages.slice();
    if(!arr.length){
      const p=document.createElement('p');
      p.style.color='var(--muted-light)';
      p.style.textAlign='center';
      p.textContent='这个会话没有可显示的消息。';
      chat.appendChild(p);
      return;
    }

    arr.forEach(m=>{
      const name=displayName(m.role);
      if(name){
        const nm=document.createElement('div');
        nm.className='name ' + (m.role==='user'?'align-right':m.role==='assistant'?'align-left':'align-center');
        nm.textContent=name;
        chat.appendChild(nm);
      }

      const metaTop=document.createElement('div');
      metaTop.className='meta-top ' + (m.role==='user'?'align-right':m.role==='assistant'?'align-left':'align-center');
      const ts=m.ts?new Date(m.ts*1000).toLocaleString():'';
      const model=m.model||'';
      const count=(m.content||'').length;
      metaTop.innerHTML = `<span>${ts||''}</span>${model?`<span class="model-chip">${escapeHTML(model)}</span>`:''}<span>字数：${count}</span>`;
      chat.appendChild(metaTop);

      const div=document.createElement('div');
      div.className=`msg ${clsByRole(m.role)}`;
      div.innerText=m.content||'';
      chat.appendChild(div);

      if(Array.isArray(m.previous) && m.previous.length){
        const details=document.createElement('details');
        details.className='branch'; // default collapsed

        const sum=document.createElement('summary');
        sum.innerHTML = `<span class="branch-badge">分支</span><span>回溯共 ${m.previous.length} 条（点此展开）</span>`;
        details.appendChild(sum);

        const thread=document.createElement('div');
        thread.className='branch-thread';

        m.previous.forEach(b=>{
          const nm2=displayName(b.role);
          if(nm2){
            const nm=document.createElement('div');
            nm.className='name ' + (b.role==='user'?'align-right':b.role==='assistant'?'align-left':'align-center');
            nm.textContent=nm2;
            thread.appendChild(nm);
          }

          const top=document.createElement('div');
          top.className='meta-top ' + (b.role==='user'?'align-right':b.role==='assistant'?'align-left':'align-center');
          const ts2=b.ts?new Date(b.ts*1000).toLocaleString():'';
          const model2=b.model||'';
          const count2=(b.content||'').length;
          top.innerHTML = `<span>${ts2||''}</span>${model2?`<span class="model-chip">${escapeHTML(model2)}</span>`:''}<span>字数：${count2}</span>`;
          thread.appendChild(top);

          const bdiv=document.createElement('div');
          bdiv.className=`msg ${clsByRole(b.role)}`;
          bdiv.innerText=b.content||'';
          thread.appendChild(bdiv);
        });

        details.appendChild(thread);
        chat.appendChild(details);
      }
    });

    updateConvMeta();
    updateLayoutHeights();
  }catch(e){
    showErr('渲染失败：'+e.message);
  }
}

/* =========================
   Export (single + batch)
========================= */
function exportCurrentConversation(){
  exportConversationByIndex(currentConvIndex);
}

function exportConversationByIndex(idx){
  try{
    const c=conversations[idx];
    if(!c){ showErr('没有可导出的会话'); return; }

    const rootStyle=getComputedStyle(document.documentElement);
    const vars=['--user','--assistant','--sys','--bubble-max','--bg-light','--text-light','--chip-light','--sep-light'];
    const cssVars=vars.map(v=>`${v}:${rootStyle.getPropertyValue(v).trim()}`).join(';');

    const esc = s => (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

    const bubble = (role, ts, model, text) => {
      const side = role==='user'?'align-right':role==='assistant'?'align-left':'align-center';
      const meta = `<div class="meta-top ${side}"><span>${ts||''}</span>${model?`<span class="model-chip">${esc(model)}</span>`:''}<span>字数：${(text||'').length}</span></div>`;
      return `${meta}<div class="msg ${role}">${esc(text||'')}</div>`;
    };

    let body='';
    c.messages.forEach(m=>{
      const ts=m.ts?new Date(m.ts*1000).toLocaleString():'';
      const nm=(function(role){
        const n=prefs.names||{};
        if(role==='user') return n.user||'';
        if(role==='assistant') return n.assistant||'';
        if(role==='system') return n.system||'';
        return '';
      })(m.role);

      if(nm){
        body += `<div class="name ${m.role==='user'?'align-right':m.role==='assistant'?'align-left':'align-center'}">${esc(nm)}</div>`;
      }

      body += bubble(m.role, ts, m.model||'', m.content||'');

      if(Array.isArray(m.previous) && m.previous.length){
        body += `<details class="branch"><summary><span class="branch-badge">分支</span><span>回溯共 ${m.previous.length} 条（点此展开）</span></summary><div class="branch-thread">`;
        m.previous.forEach(b=>{
          const ts2=b.ts?new Date(b.ts*1000).toLocaleString():'';
          const nm2=(function(role){
            const n=prefs.names||{};
            if(role==='user') return n.user||'';
            if(role==='assistant') return n.assistant||'';
            if(role==='system') return n.system||'';
            return '';
          })(b.role);
          if(nm2){
            body += `<div class="name ${b.role==='user'?'align-right':b.role==='assistant'?'align-left':'align-center'}">${esc(nm2)}</div>`;
          }
          body += bubble(b.role, ts2, b.model||'', b.content||'');
        });
        body += `</div></details>`;
      }
    });

    const html = `<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(c.title||'导出')}</title>
<style>
:root{${cssVars}}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:var(--bg-light);color:var(--text-light)}
.container{padding:1rem;max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:.8rem}
.chat{display:flex;flex-direction:column;gap:.62rem}
.name,.meta-top{font-size:.72rem;color:rgba(60,60,67,.60)}
.meta-top{display:flex;gap:.45rem;flex-wrap:wrap;margin:.05rem .18rem}
.align-right{margin-left:auto;text-align:right}
.align-left{margin-right:auto;text-align:left}
.align-center{margin-left:auto;margin-right:auto;text-align:center}
.model-chip{padding:.08rem .4rem;border-radius:999px;background:var(--chip-light);border:1px solid var(--sep-light)}
.msg{max-width:var(--bubble-max);border-radius:18px;padding:.55rem .72rem;line-height:1.55;white-space:pre-wrap;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.msg.user{background:var(--user);color:#fff;margin-left:auto}
.msg.assistant{background:#fff;color:#111;margin-right:auto}
.msg.system{margin-left:auto;margin-right:auto;background:rgba(175,82,222,.18);border:1px solid rgba(175,82,222,.22)}
details.branch{border-left:4px solid rgba(10,132,255,.7);background:rgba(255,255,255,.7);border-radius:12px;padding:.35rem .55rem;margin:.35rem 0 .15rem 0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.branch summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:.5rem;font-size:.78rem;font-weight:600;padding:.2rem 0}
.branch summary::-webkit-details-marker{display:none}
.branch .branch-badge{font-size:.72rem;padding:.1rem .45rem;border-radius:999px;background:rgba(0,0,0,.06);border:1px solid rgba(60,60,67,.18)}
.branch-thread{display:flex;flex-direction:column;gap:.55rem;margin:.45rem .1rem .55rem .25rem}
.branch .msg{max-width:calc(var(--bubble-max) - 6%)}
</style></head><body>
<div class="container">
  <h2 style="margin:.2rem 0 1rem 0">${esc(c.title||'(无标题)')}</h2>
  <div class="chat">${body}</div>
</div></body></html>`;

    const blob=new Blob([html],{type:'text/html'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`${(c.title||'chat_export').replace(/[\\/:*?"<>|]/g,'_')}.html`;

    // iOS: schedule click to avoid being swallowed
    setTimeout(()=>{
      a.click();
      URL.revokeObjectURL(url);
    },0);
  }catch(e){
    showErr('导出失败：'+e.message);
  }
}

/* Batch export modal */
const batchModal=document.getElementById('batchModal');
const batchList=document.getElementById('batchList');

function openBatchModal(){
  if(!conversations.length){ showErr('请先导入会话'); return; }
  buildBatchList();
  batchModal.classList.add('show');
}
function closeBatchModal(){ batchModal.classList.remove('show'); }
function buildBatchList(){
  batchList.innerHTML='';
  conversations.forEach((c,idx)=>{
    const row=document.createElement('label');
    row.className='row';
    const dateStr=c.created?new Date(c.created*1000).toLocaleDateString():'';
    row.innerHTML = `
      <input type="checkbox" data-idx="${idx}">
      <div style="flex:1">
        <div>${escapeHTML(c.title||`(无标题) ${idx+1}`)}</div>
        <div class="meta-mini">消息 ${c.messages.length}${dateStr?` · ${dateStr}`:''} · 字数 ${c.totalChars||0}</div>
      </div>
    `;
    batchList.appendChild(row);
  });
}
function selectAllBatch(on){
  batchList.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.checked=!!on);
}

/* True sequential batch export (iOS-friendly) */
async function doBatchExport(){
  const ids=[...batchList.querySelectorAll('input[type=checkbox]:checked')].map(cb=>Number(cb.dataset.idx));
  if(!ids.length){ showErr('请先选择要导出的会话'); return; }

  // iOS Safari throttles multiple downloads; do sequential with delay
  for(const id of ids){
    exportConversationByIndex(id);
    await new Promise(r=>setTimeout(r, 500));
  }
}

/* =========================
   Nav behavior (more app-like)
========================= */
(function(){
  const main=document.getElementById('mainScroll');
  const title=document.getElementById('navTitle');
  if(!main || !title) return;
  let last=0;
  main.addEventListener('scroll', ()=>{
    const y=main.scrollTop;
    if(y > last + 6){
      title.style.opacity='0.58';
      title.style.transform='translateY(-1px)';
    }else if(y < last - 6){
      title.style.opacity='1';
      title.style.transform='translateY(0)';
    }
    last=y;
  }, {passive:true});
})();

/* =========================
   Apply prefs on load
========================= */
(function init(){
  try{
    dark = !!prefs.dark;
    document.body.classList.toggle('dark', dark);

    if(prefs.colors){
      if(prefs.colors.user) setCSS('--user', prefs.colors.user);
      if(prefs.colors.assistant) setCSS('--assistant', prefs.colors.assistant);
      if(prefs.colors.sys) setCSS('--sys', prefs.colors.sys);

      if(prefs.colors.user) document.getElementById('cUser').value = prefs.colors.user;
      if(prefs.colors.assistant) document.getElementById('cAssistant').value = prefs.colors.assistant;
      if(prefs.colors.sys) document.getElementById('cSystem').value = prefs.colors.sys;
    }else{
      document.getElementById('cUser').value = '#0a84ff';
      document.getElementById('cAssistant').value = '#1c1c1e';
      document.getElementById('cSystem').value = '#af52de';
    }

    if(prefs.bubble){
      setCSS('--bubble-max', prefs.bubble + '%');
      document.getElementById('bubbleWidth').value = Number(prefs.bubble);
      document.getElementById('bubbleVal').textContent = `${prefs.bubble}%`;
    }

    if(prefs.names){
      document.getElementById('nameUser').value = prefs.names.user || '';
      document.getElementById('nameAssistant').value = prefs.names.assistant || '';
      document.getElementById('nameSystem').value = prefs.names.system || '';
    }

    setPanelOpen(!!prefs.panelOpen);
    setStableVH();
    updateLayoutHeights();
  }catch(e){
    showErr('初始化失败：'+e.message);
  }
})();

/* keep stable */
window.addEventListener('resize', ()=>{ setStableVH(); updateLayoutHeights(); });
window.addEventListener('orientationchange', ()=>{ setTimeout(()=>{ setStableVH(); updateLayoutHeights(); }, 300); });
